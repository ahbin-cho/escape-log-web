<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
html,body{margin:0;width:1080px;height:1350px;font-family:P;overflow:hidden;color:#1D1D1D;background:#F5F0E6}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(29,29,29,.06) 1.5px,transparent 1.6px);background-size:28px 28px}
h1{font-family:A;font-weight:400;margin:0;line-height:1.12}
.top{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:A;font-size:32px}
.pg{border:3px solid #1D1D1D;border-radius:999px;background:#FFFCF6;padding:6px 18px;font-weight:800;font-size:24px}
.kick{position:absolute;left:80px;top:170px;font-weight:800;font-size:30px;color:#E49A4A}
.acc{color:#E49A4A;text-shadow:5px 5px 0 #1D1D1D}
.sub{position:absolute;left:80px;right:80px;font-weight:500;font-size:30px;line-height:1.5;color:#5A5148}
.shot{position:absolute;background:#FFFCF6;border:4px solid #1D1D1D;border-radius:30px;box-shadow:9px 9px 0 #1D1D1D;overflow:hidden}
.shot img{display:block;width:100%}
.phone{position:absolute;background:#1D1D1D;border-radius:56px;padding:16px;box-shadow:10px 10px 0 #E49A4A}
.phone .scr{border-radius:42px;overflow:hidden;background:#F5F0E6}
.phone img{display:block;width:100%}
.mascot{position:absolute}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;align-items:center}
.cta{border:4px solid #1D1D1D;border-radius:18px;background:#E49A4A;color:#fff;font-weight:800;font-size:31px;padding:14px 28px;box-shadow:6px 6px 0 #1D1D1D}
.url{font-family:A;font-size:26px}
.sticker{position:absolute;border:3px solid #1D1D1D;border-radius:999px;background:#FFFCF6;padding:8px 20px;font-weight:800;font-size:26px;box-shadow:4px 4px 0 #1D1D1D}
</style></head><body><div class="dots"></div>
<div class="top"><span class="brand">방탈로그</span><span class="pg">3 / 6</span></div>
<div class="kick">📅 달력 다이어리</div>
<h1 style="position:absolute;left:76px;top:220px;font-size:92px">이번 달 얼마나<br><span class="acc">달렸는지</span> 한눈에</h1>
<div class="sub" style="top:450px">다녀온 날짜 칸이 테마 포스터(또는 내 인증샷)로 채워져요.</div>
<div class="shot" style="left:80px;right:80px;top:600px"><img src="../assets/diary-0.png" style="margin-top:-210px"></div>
<img class="mascot" src="../../../public/mascot.png" style="right:90px;top:960px;width:220px;transform:rotate(10deg)">
<div class="sticker" style="left:100px;top:1010px;transform:rotate(-3deg)">이번 달 4방 · 탈출 3 🔥</div>

<div class="foot"><span class="cta">먼저 써 보고 10초 가입 → 프로필 링크</span><span class="url">bangtallog.com</span></div></body></html>
