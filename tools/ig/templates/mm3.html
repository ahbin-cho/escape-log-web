*{box-sizing:border-box;margin:0;padding:0}

</style><style>

.clv{position:absolute;font-size:120px;transform:rotate(-14deg)}
</style><style>
@font-face{font-family:BH;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2);font-weight:800}

.fly{position:absolute;font-family:BH;color:#B3261E;text-align:center;line-height:1.05;transform:rotate(-2deg)}
