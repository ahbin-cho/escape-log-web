<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2)}
@font-face{font-family:B;src:url(../assets/fonts/east-sea-dokdo-korean-400-normal.woff2)}
@font-face{font-family:H;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
html,body{margin:0;width:1080px;height:1350px;font-family:P;overflow:hidden}
.abs{position:absolute}
.top{position:absolute;left:64px;right:64px;top:54px;display:flex;justify-content:space-between;align-items:center;z-index:20;font-weight:800;font-size:24px}
.info{position:absolute;left:0;right:0;top:880px;bottom:0;z-index:15;padding:34px 70px 0}
.q{font-size:36px;line-height:1.45;word-break:keep-all;font-weight:800}
.specs{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.sp{border-radius:999px;padding:8px 18px;font-weight:800;font-size:25px;display:flex;align-items:center;gap:8px}
.sp small{font-size:19px;opacity:.75}
.pip{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:3px}
.foot{position:absolute;left:70px;right:70px;bottom:52px;display:flex;justify-content:space-between;align-items:baseline;z-index:16;font-weight:800;font-size:24px}
body{background:#2B1E10}
.leather{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#6B4E28 0%,#4A3419 45%,#22170B 100%)}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,230,180,.06) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.4px);background-size:5px 5px,9px 9px}
.photo{position:absolute;left:230px;top:130px;width:600px;height:560px;background:linear-gradient(160deg,#D9C39A,#B39563);transform:rotate(-5deg);box-shadow:14px 18px 40px rgba(0,0,0,.55);padding:26px;box-sizing:border-box}
.pic{position:relative;width:100%;height:100%;background:linear-gradient(180deg,#B9A27A 0%,#8E7650 60%,#5B4930 100%);overflow:hidden}
.mag{position:absolute;left:120px;top:330px;width:290px;height:290px;border-radius:50%;border:26px solid #2A1C0E;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(200,170,110,.12) 60%);box-shadow:8px 12px 26px rgba(0,0,0,.5);z-index:7}
.handle{position:absolute;left:330px;top:610px;width:60px;height:260px;background:linear-gradient(90deg,#1F140A,#4A3018,#1F140A);border-radius:30px;transform:rotate(-32deg);transform-origin:top center;z-index:6;box-shadow:8px 12px 20px rgba(0,0,0,.5)}
.compass{position:absolute;right:70px;top:470px;width:190px;height:190px;border-radius:50%;border:16px solid #7A5A2A;background:radial-gradient(circle,#E3CFA0,#B89862);box-shadow:8px 12px 24px rgba(0,0,0,.5);z-index:7}
.gold{background:linear-gradient(180deg,#F1D79A,#C29A4C 55%,#7D5A22);-webkit-background-clip:text;color:transparent}</style></head><body>
<div class="leather"></div><div class="grain"></div>
<div class="photo"><div class="pic">
 <div class="abs" style="left:150px;bottom:0;width:250px;height:190px;background:#3A2B19"></div>
 <div class="abs" style="left:175px;bottom:170px;width:200px;height:200px;border-radius:100px 100px 0 0;background:#33261680;background:#352716"></div>
 <div class="abs" style="left:255px;bottom:355px;width:40px;height:90px;background:#2C2012"></div>
 <div class="abs" style="left:60px;bottom:0;width:90px;height:230px;background:#40301C"></div><div class="abs" style="left:60px;bottom:230px;width:90px;height:70px;background:#40301C;clip-path:polygon(50% 0,100% 100%,0 100%)"></div>
 <div class="abs" style="left:400px;bottom:0;width:90px;height:230px;background:#40301C"></div><div class="abs" style="left:400px;bottom:230px;width:90px;height:70px;background:#40301C;clip-path:polygon(50% 0,100% 100%,0 100%)"></div>
 <div class="abs" style="left:245px;bottom:60px;width:60px;height:60px;border-radius:50%;border:8px solid #6B5433"></div>
</div></div>
<div class="handle"></div><div class="mag"></div>
<div class="compass"><div class="abs" style="left:50%;top:50%;width:10px;height:120px;margin:-60px 0 0 -5px;background:linear-gradient(180deg,#8E2A1A 50%,#2A1C0E 50%);transform:rotate(35deg);border-radius:5px"></div></div>
<div class="abs gold" style="left:0;right:0;top:690px;text-align:center;font-family:M;font-size:126px;letter-spacing:.04em;z-index:9">에델슈타인</div>
<div class="abs" style="left:0;right:0;top:838px;text-align:center;font-family:M;font-size:34px;letter-spacing:.6em;color:#C9A257;z-index:9">— 더 비기닝 —</div>
<div class="top" style="color:#D9C39A"><span style="font-family:A;font-size:28px">방탈로그</span><span>잠입 · 5 / 7</span></div>
<div class="info" style="background:transparent;border-top:none;color:#F0E2C4">
<div style="font-weight:800;font-size:22px;letter-spacing:.2em;color:#C9A257">사건 의뢰</div>
<div class="q" style="margin-top:10px;font-family:M">“에델슈타인의 사람들이 하나씩 실종되고 있다는 소문이 들려온다. 이 마을엔 대체 어떤 사건이 일어나고 있는걸까...”</div>
<div class="specs">
<span class="sp" style="background:rgba(201,162,87,.16);color:#F0E2C4"><small>난이도</small><i class="pip" style="background:#C9A257;border:3px solid #C9A257"></i><i class="pip" style="background:#C9A257;border:3px solid #C9A257"></i><i class="pip" style="background:#C9A257;border:3px solid #C9A257"></i><i class="pip" style="background:transparent;border:3px solid rgba(201,162,87,.5)"></i><i class="pip" style="background:transparent;border:3px solid rgba(201,162,87,.5)"></i></span>
<span class="sp" style="background:rgba(201,162,87,.16);color:#F0E2C4"><small>공포도</small><b style="margin-left:4px">없음</b></span>
<span class="sp" style="background:rgba(201,162,87,.16);color:#F0E2C4"><small>시간</small>60분</span>
<span class="sp" style="background:rgba(201,162,87,.16);color:#F0E2C4"><small>인원</small>3~6명</span>
</div></div>
<div class="foot" style="color:#A88E62"><span>메이플스토리 이스케이프 · 홍대</span><span style="font-family:A">bangtallog.com</span></div>
</body></html>
