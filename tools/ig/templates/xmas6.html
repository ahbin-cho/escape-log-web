<!doctype html><html><head><meta charset="utf-8"><style>
/* 크리스마스 방탈출 모음(줄거리에 크리스마스가 나오는 방). 정보·줄거리는 매장 공식 소개(우리 catalog) 기준. 포스터는 공식 원본을 작게 + 출처 표기(키이스케이프는 글만). */
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:HL;src:url(../assets/fonts/Handletter.woff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#1D1D1D;background:#1F4A38}
.snow{position:absolute;inset:0;background-image:radial-gradient(#fff 3px,transparent 4px),radial-gradient(#ffffffaa 2px,transparent 3px),radial-gradient(#ffffff77 4px,transparent 5px);background-size:190px 210px,130px 150px,310px 270px;background-position:20px 30px,80px 110px,150px 60px;opacity:.5}
.lights{position:absolute;left:0;right:0;top:0;height:70px;background:radial-gradient(circle at 50% 0,#E2483F 0 14px,transparent 15px) 0 26px/120px 60px repeat-x,radial-gradient(circle at 50% 0,#F2C14E 0 14px,transparent 15px) 60px 34px/120px 60px repeat-x;border-top:6px solid #12301f}
.top{position:absolute;left:64px;right:64px;top:92px;display:flex;justify-content:space-between;align-items:center}
.chip{background:#E2483F;color:#fff;border:4px solid #1D1D1D;border-radius:999px;padding:6px 22px;font:800 26px P;box-shadow:4px 4px 0 #1D1D1D}
.pg{background:#F5F0E6;border:4px solid #1D1D1D;border-radius:999px;padding:6px 18px;font:800 24px P}
.card{position:absolute;left:56px;right:56px;top:176px;bottom:120px;background:#F5F0E6;border:6px solid #1D1D1D;border-radius:30px;box-shadow:12px 12px 0 #12301f;padding:44px 46px}
.ft{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;align-items:baseline;font:800 21px P;color:#D9E8DD}
.ft b{font:400 26px A;color:#F5F0E6}
h1{font:400 76px/1.12 A;word-break:keep-all}
.store{display:inline-block;margin-top:18px;background:#FFE7A3;border:4px solid #1D1D1D;border-radius:999px;padding:6px 20px;font:800 30px P}
.row{display:flex;gap:32px;margin-top:44px;align-items:flex-start}
.poster{flex:none;width:340px}.poster img{display:block;width:340px;border:4px solid #1D1D1D;border-radius:12px;box-shadow:6px 6px 0 #1D1D1D}
.poster div{font:500 19px P;color:#6B6258;margin-top:10px}
.story{font:400 56px/1.3 HL;color:#2a2a2a;word-break:keep-all}
.story:before{content:"이 방의 이야기";display:block;font:800 24px P;color:#E2483F;margin-bottom:10px;letter-spacing:.04em}
.tags{position:absolute;left:46px;right:46px;bottom:40px;display:flex;flex-wrap:wrap;gap:12px}
.tags span{background:#fff;border:4px solid #1D1D1D;border-radius:14px;padding:10px 22px;font:800 34px P;box-shadow:4px 4px 0 #1D1D1D}
.tags span.g{background:#CFE8D6}
</style></head><body><div class="snow"></div><div class="lights"></div>
<div class="top"><span class="chip">🎄 예약 팁</span><span class="pg">6 / 6</span></div>
<div class="card" style="padding-top:60px">
<h1 style="font-size:92px">크리스마스 주간은<br><span style="color:#E2483F">일찍</span> 잡아요</h1>
<div style="margin-top:44px;display:flex;flex-direction:column;gap:22px">
<div style="background:#fff;border:4px solid #1D1D1D;border-radius:18px;padding:22px 28px;font:800 36px/1.35 P;box-shadow:6px 6px 0 #1D1D1D">👨‍👩‍👧‍👦 연말 모임이면 → <span style="color:#1F7A4D">2~6명</span> 되는 방 (2·3·4장)</div>
<div style="background:#fff;border:4px solid #1D1D1D;border-radius:18px;padding:22px 28px;font:800 36px/1.35 P;box-shadow:6px 6px 0 #1D1D1D">💑 둘이서 조용히 → <span style="color:#1F7A4D">DAVE</span> (5장)</div>
<div style="background:#fff;border:4px solid #1D1D1D;border-radius:18px;padding:22px 28px;font:800 36px/1.35 P;box-shadow:6px 6px 0 #1D1D1D">📅 예약 여는 날은 매장마다 달라요.<br>가고 싶은 방은 공식 예약 페이지에서 미리 확인!</div>
</div>
<div style="position:absolute;left:46px;right:46px;bottom:40px;display:flex;align-items:center;gap:22px"><img src="../assets/mascot-santa.png" style="width:170px"><div style="font:400 58px/1.2 HL">다녀오면 그날을 한 줄로 남겨요.<br>크리스마스 추억은 탈깍노트에 🎁</div></div></div><div class="ft"><span>줄거리·정보는 매장 공식 소개 기준 · 예약 전 공식 페이지 확인</span><b>탈깍노트</b></div></body></html>
