<!doctype html><html><head><meta charset="utf-8"><style>
/* 햄즈 살찌우기(셜록홈즈 안양범계점, 2026 신작) — 제미나이 그림 2장(보통·빵빵) + 친구와 대화 (docs/reels-standard.md) */
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#fbe9c8}
#cam{position:absolute;inset:0;transform-origin:41% 50%;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
#cam img{position:absolute;inset:0;width:1080px;height:1920px}
#b{opacity:0}
#win{position:absolute;left:150px;top:560px;font:400 120px/1 A;color:#fffbf1;-webkit-text-stroke:12px #1d1d1d;paint-order:stroke fill;text-shadow:9px 9px 0 #E04A3A;transform:scale(0) rotate(-8deg);transition:transform .45s cubic-bezier(.2,1.7,.4,1)}
#watch{position:absolute;right:70px;top:330px;width:250px;padding:14px 0;text-align:center;background:#fffbf1;border:6px solid #1d1d1d;border-radius:30px;box-shadow:7px 8px 0 #1d1d1d;font:400 64px/1 A;color:#1d1d1d;transform:rotate(4deg)}
#watch small{display:block;font:400 26px/1 A;color:#e04a3a;margin-bottom:6px}
#ghost{position:absolute;left:60px;top:300px;width:220px;transform-origin:50% 90%;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-3deg)}}
#chat{position:absolute;left:36px;right:36px;top:1480px;height:420px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;overflow:hidden;padding:0 16px 16px}
.bub{max-width:88%;font:400 58px/1.2 A;padding:14px 30px;white-space:nowrap;flex:none;color:#1d1d1d;border:6px solid #1d1d1d;box-shadow:7px 8px 0 #1d1d1d}
.bub.f{align-self:flex-start;background:#fffbf1;border-radius:10px 44px 40px 46px/10px 40px 46px 38px;transform-origin:0 100%}
.bub.m{align-self:flex-end;background:#F2B23E;border-radius:44px 10px 46px 40px/40px 10px 38px 46px;transform-origin:100% 100%}
.bub small{display:block;font:400 26px/1 A;opacity:.6;margin-bottom:4px}
#cam.shake{animation:sh .12s linear infinite}
@keyframes sh{0%{translate:0 0}25%{translate:-7px 4px}50%{translate:6px -5px}75%{translate:-4px -3px}}
.pk{position:absolute;width:260px;height:260px;background:url(../assets/reels/hamz/hamz-face.png) center/contain no-repeat;filter:drop-shadow(7px 8px 0 #1d1d1d);transition:transform .25s cubic-bezier(.2,1.7,.4,1);z-index:5}
.sw{position:absolute;width:34px;height:50px;background:#8fd0ee;border:5px solid #1d1d1d;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;opacity:0;z-index:6}
#hook{position:absolute;left:0;right:0;top:620px;text-align:center;font:400 104px/1.15 A;color:#fffbf1;-webkit-text-stroke:14px #1d1d1d;paint-order:stroke fill;text-shadow:10px 10px 0 #E49A4A;transition:opacity .3s;z-index:7}
#end{position:absolute;left:0;right:0;top:330px;text-align:center;opacity:0;transform:translateY(-30px);transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#end b{display:inline-block;font:400 46px/1.35 A;background:#E49A4A;color:#1D1D1D;border:6px solid #1D1D1D;border-radius:24px;padding:12px 34px;box-shadow:9px 9px 0 #1D1D1D}
#end i{display:block;font-style:normal;font-size:30px;opacity:.75}
.conf{position:absolute;width:24px;height:36px;opacity:0;border-radius:4px}
</style></head><body>
<div id="cam"><img id="a" src="../assets/reels/hamz/hamz-a.jpg"><img id="b" src="../assets/reels/hamz/hamz-b.jpg"><div id="win">WIN!</div></div>
<div id="watch"><small>TIME ATTACK</small><span id="t">00:00</span></div>
<img id="ghost" src="../../../public/mascot.png">
<div id="chat"></div>
<div id="hook">누구 햄즈 살이<br>더 올랐나?</div>
<div class="pk" id="p1" style="left:-40px;top:900px;transform:translateX(-360px) rotate(-14deg)"></div><div class="pk" id="p2" style="right:-40px;top:760px;transform:translateX(360px) rotate(12deg)"></div><div class="pk" id="p3" style="left:560px;top:420px;transform:translateY(-760px) rotate(170deg)"></div>
<div id="end"><b>햄즈 살찌우기 · 도파민 아케이드<i>셜록홈즈 안양범계점 · 승자 타임어택 할인</i></b></div>
<script>
const $=s=>document.querySelector(s),T=(ms,f)=>setTimeout(f,ms),FR=1000/12;
// 보통(a)에서 '먹여!' 마다 통통 튀며 다가가다가 세 번째에 빵빵(b)으로 바뀐다(두 그림을 섞으면 햄찌가 겹쳐 보여서 한 번에 바꾼다). 부풀 때 햄찌 쪽으로 통 튀고, 그림은 손그림처럼 살짝 떨린다
const cam=$('#cam');let jx=0;
setInterval(()=>{cam.style.translate=`${(Math.random()-.5)*3}px ${(Math.random()-.5)*3}px`},170);
const grow=(o,z)=>{if(o)$('#b').style.opacity=1;cam.style.transform=`scale(${z+.08})`;T(200,()=>cam.style.transform=`scale(${z})`)};
let sec=0;const tick=setInterval(()=>{sec++;$('#t').textContent='00:'+String(sec).padStart(2,'0')},1000);
const chat=$('#chat');
const say=(who,txt,ms)=>T(ms,()=>{const b=document.createElement('div');b.className='bub '+who;b.dataset.r=who==='f'?-1.2:1.2;b.dataset.s=.5;b.innerHTML=(who==='f'?'<small>친구</small>':'')+txt;chat.appendChild(b);
 while(chat.children.length>3)chat.firstChild.remove();[.5,1.12,.96,1].forEach((sc,k)=>setTimeout(()=>{b.dataset.s=sc},k*FR))});
setInterval(()=>[...chat.children].forEach(b=>b.style.transform=`scale(${b.dataset.s}) rotate(${+b.dataset.r+(Math.random()-.5)*1.2}deg) translate(${(Math.random()-.5)*3}px,${(Math.random()-.5)*3}px)`),170);
// 실제 후기 두 편 분위기를 참고: 귀여운데 친구끼리 붙으면 땀범벅 대결(공식 안내: 활동성 60%·팀 대결 타임어택). 후기 문장·사진은 쓰지 않는다
T(1500,()=>$('#hook').style.opacity=0);
say('f','햄스터 식당 귀엽다 🐹',1600);say('m','우리 1대1 할래?',2300);
say('f','콜. 진 사람이 밥 사기 ㅋ',3000);
T(3400,()=>{cam.classList.add('shake');$('#watch').style.background='#ff8a7a';sweat()});
say('m','내 햄찌가 더 빵빵해!!',3700);
say('f','아니거든 내 거 봐!!',4400);T(4600,()=>grow(0,1.05));
const peek=(id,ms,back)=>{T(ms,()=>$(id).style.transform='none');T(ms+back,()=>$(id).style.transform=$(id).dataset.h)};
['#p1','#p2','#p3'].forEach(id=>$(id).dataset.h=$(id).style.transform);
peek('#p1',4900,700);peek('#p2',5400,700);peek('#p3',5900,800);
say('m','햄찌야 그만 좀 나와 ㅠㅠ',5300);T(5700,()=>grow(0,1.1));
say('f','하나만 더!!!',6300);T(6700,()=>grow(1,1.0));
T(7400,()=>{cam.classList.remove('shake');$('#win').style.transform='scale(1) rotate(-8deg)';clearInterval(tick);$('#watch').style.background='#f8cd48';
 for(let i=0;i<60;i++){const c=document.createElement('div');c.className='conf';c.style.left=(540+(Math.random()-.5)*160)+'px';c.style.top='800px';
  c.style.background=['#E49A4A','#E2554A','#3E9A6A','#7A68C2','#F5C342','#fff'][i%6];document.body.appendChild(c);
  const a=-Math.PI/2+(Math.random()-.5)*2.4,d=600+Math.random()*700;
  c.animate([{opacity:1,transform:'translate(0,0)'},{opacity:1,transform:`translate(${Math.cos(a)*d*.6}px,${Math.sin(a)*d}px) rotate(${360*Math.random()}deg)`,offset:.35},{opacity:.9,transform:`translate(${Math.cos(a)*d*.8}px,${Math.sin(a)*d+1100}px) rotate(${900*Math.random()}deg)`}],{duration:2600,easing:'cubic-bezier(.2,.6,.5,1)',fill:'forwards'})}});
function sweat(){for(let i=0;i<14;i++){const d=document.createElement('div');d.className='sw';const left=Math.random()<.5;d.style.left=(left?40+Math.random()*180:860+Math.random()*180)+'px';d.style.top=(300+Math.random()*500)+'px';document.body.appendChild(d);
 d.animate([{opacity:0,transform:'translateY(0)'},{opacity:1,offset:.15},{opacity:0,transform:'translateY(260px)'}],{duration:900,delay:Math.random()*3600,fill:'forwards'})}}
say('f','이겼다 ㅋㅋㅋ 밥 사',7300);
say('m','(헥헥) 한 판만 더…',8200);say('f','다음엔 2대2로 오자 ㅋㅋ',9000);
T(9700,()=>{$('#watch').style.opacity=0;$('#end').style.opacity=1;$('#end').style.transform='none'});
</script></body></html>
