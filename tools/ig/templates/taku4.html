<!doctype html><html><head><meta charset="utf-8"><style>
/* 타쿠의 심야괴담(제로월드 다이브 건대점) 후기 정리 피드 5장.
   정보: 제로월드 공식 예약 페이지(75분·2~6명·추천 3인·광과민성 안내·14일 전 12:30 오픈). 후기: 네이버 블로그 후기 8편(11/21 읽음)에서 짧게 인용·간추림.
   포스터는 공식 원본을 자르지 않고 작게, 출처 표기. */
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#F5F0E6;background:#160908}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 900px 700px at 78% 8%,rgba(226,52,45,.42),transparent 70%),radial-gradient(ellipse 700px 600px at 0% 100%,rgba(201,139,74,.16),transparent 70%)}
body:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:7px 9px}
.top{position:absolute;left:64px;right:64px;top:56px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.air{display:flex;align-items:center;gap:12px;border:4px solid #E2342D;border-radius:12px;padding:6px 18px;font:800 26px P;color:#FF5A52;letter-spacing:.12em;box-shadow:0 0 24px rgba(226,52,45,.5)}
.air:before{content:"";width:16px;height:16px;border-radius:50%;background:#FF3B32;box-shadow:0 0 14px #FF3B32}
.pg{border:3px solid rgba(245,240,230,.5);border-radius:999px;padding:5px 18px;font:800 24px P}
h1{position:absolute;left:64px;right:64px;top:150px;font:400 84px/1.14 A;z-index:3}
h1 em{font-style:normal;color:#FF5A52}
.sub{position:absolute;left:64px;right:64px;top:352px;font:500 32px/1.4 P;color:#CFC4B6;z-index:3}
.list{position:absolute;left:56px;right:56px;top:450px;bottom:104px;display:flex;flex-direction:column;justify-content:space-between;z-index:3}
.q{background:#F5F0E6;color:#1D1D1D;border:5px solid #1D1D1D;border-radius:24px;box-shadow:8px 8px 0 #E2342D;padding:30px 34px}
.q b{display:block;font:800 47px/1.28 M;letter-spacing:-.01em}
.q b i{font-style:normal;color:#D02A24}
.q span{display:block;font:500 28px P;color:#6B6258;margin-top:10px}
.kv{display:flex;align-items:center;gap:22px}
.kv .k{flex:none;width:170px;font:400 34px A;color:#D02A24}
.kv .v{font:800 42px/1.25 P}.kv .v small{display:block;font:500 28px P;color:#6B6258;margin-top:4px}
.ft{position:absolute;left:64px;right:64px;bottom:36px;display:flex;justify-content:space-between;align-items:baseline;font:500 21px P;color:#A99C8E;z-index:3}
.ft b{font:400 27px A;color:#F5F0E6}
</style></head><body>
<div class="top"><span class="air">ON AIR</span><span class="pg">4 / 5</span></div><h1>가기 전에<br><em>이것만</em> 챙겨</h1><div class="sub">후기에서 여러 번 나온 것만 모았어요</div><div class="list"><div class="q kv"><div class="k">인원</div><div class="v">3~4명<small>공식 추천은 3인 · 겁 많은 사람이 있으면 4명</small></div></div><div class="q kv"><div class="k">옷</div><div class="v">치마보다 바지<small>활동은 걷는 정도. 놀라서 주저앉을 수 있대요</small></div></div><div class="q kv"><div class="k">공포</div><div class="v">어둠 · 큰 소리 · 직원 연출<small>이 셋에 약하면 탱 한 명은 꼭 같이</small></div></div><div class="q kv"><div class="k">주의</div><div class="v">광과민성 증후군은 이용 불가<small>매장 공식 안내</small></div></div></div><div class="ft"><span>후기: 네이버 블로그 방탈출 후기 8편에서 인용·간추림 · 주의: 매장 공식 안내</span><b>방탈깍노트</b></div></body></html>
