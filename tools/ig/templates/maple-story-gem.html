<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:H;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;font-family:P;font-weight:800;overflow:hidden;color:#fff;background:#8FD0FF url(../assets/maple-gem-bg.jpg) center top/1080px auto no-repeat}
.abs{position:absolute}
.t{font-family:H;font-weight:400;color:#fff;-webkit-text-stroke:10px #2A2F6B;paint-order:stroke fill;text-shadow:0 9px 0 #2A2F6B;line-height:1.12}
.pill{display:inline-block;font-size:28px;border:5px solid #2A2F6B;border-radius:999px;padding:6px 20px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#2A2F6B;border:5px solid #2A2F6B;border-radius:18px;box-shadow:0 6px 0 #2A2F6B;font-size:28px;padding:7px 16px}
.pz{position:absolute;width:152px;height:190px;border:6px solid #2A2F6B;border-radius:16px;background-size:auto 272px;background-position:center -8px;box-shadow:0 8px 0 #2A2F6B,0 0 26px rgba(255,255,255,.7);transform-origin:bottom center}
.pz:after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
.no{position:absolute;left:-16px;top:-16px;width:46px;height:46px;border-radius:50%;background:#FFE27A;color:#2A2F6B;border:5px solid #2A2F6B;font-family:A;font-size:24px;display:flex;align-items:center;justify-content:center}
.tag{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2A2F6B;border:4px solid #2A2F6B;border-radius:999px;font-size:21px;padding:3px 12px}
</style></head><body>

</div>

<div class="abs" style="left:385px;top:440px;font-size:26px;color:#2A2F6B;background:#fff;border:5px solid #2A2F6B;border-radius:16px;padding:7px 16px;box-shadow:0 6px 0 #2A2F6B;transform:rotate(-3deg)">메이플 세계로 들어가는 방탈출 5개 🍁</div>

<div class="abs" style="left:0;right:0;top:1300px;display:flex;justify-content:center;gap:12px">

</div>

  <div class="t" style="font-size:60px;-webkit-text-stroke:8px #2A2F6B;text-shadow:0 6px 0 #2A2F6B">어떤 책부터 펼칠까? 👇</div>
</div>
</body></html>
