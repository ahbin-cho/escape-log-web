 background-image:repeating-linear-gradient(180deg,transparent 0 78px,#E6DCC8 78px 80px)}

<p style="padding-top:70px"><b style="font-weight:800">안녕하세요, 방탈로그 운영자예요.</b></p>
<p>방탈출 다녀오면 후기를 남기고 싶은데,</p>
<p>내 기록만 모아 볼 곳이 마땅치 않더라고요.</p>
<p>그래서 <b style="font-weight:800;color:#EE7A2B">제 후기 남기려고</b> 직접 만들었어요.</p>
<p>&nbsp;</p>
<p>하나씩 쌓다 보니 표지가 붙은 다이어리가 되고,</p>
<p>달력이 채워지고, 제 취향도 보이더라고요.</p>
<p>&nbsp;</p>
<p>이제 여러분 기록도 같이 쌓아 가고 싶어요.</p>
