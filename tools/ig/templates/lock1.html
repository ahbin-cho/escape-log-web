.top{position:absolute;left:60px;right:60px;top:56px;display:flex;justify-content:space-between;align-items:center;z-index:3}

.pg{background:#fff;border:4px solid #1D1D1D;border-radius:999px;padding:5px 18px;font:800 24px P}
h1{position:absolute;left:60px;right:60px;top:140px;font:400 92px/1.12 A;z-index:3}
h1 em{font-style:normal;color:#D9822B}
.sub{position:absolute;left:62px;right:60px;top:368px;font:500 32px/1.45 P;color:#4a4339;z-index:3}
.card{background:#fff;border:6px solid #1D1D1D;border-radius:26px;box-shadow:9px 9px 0 #1D1D1D;padding:24px 30px}
.card b{display:block;font:400 42px/1.2 A}.card b i{font-style:normal;color:#D9822B}
.card span{display:block;font:500 27px/1.4 P;color:#5a5248;margin-top:8px}
.list{position:absolute;left:56px;right:56px;display:flex;flex-direction:column;gap:22px;z-index:3}
.ft{position:absolute;left:60px;right:60px;bottom:36px;display:flex;justify-content:space-between;align-items:baseline;font:500 21px P;color:#7a7065;z-index:3}
.ft b{font:400 28px A;color:#1D1D1D}
