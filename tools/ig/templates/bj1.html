<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
html,body{margin:0;width:1080px;height:1350px;font-family:P;overflow:hidden;color:#1D1D1D}
.bg{position:absolute;inset:0;background:#EFE2C4}
.paper{position:absolute;inset:0;background-image:radial-gradient(rgba(120,90,40,.08) 1.2px,transparent 1.4px),radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px);background-size:7px 7px,11px 11px}
.straw{position:absolute;left:0;right:0;bottom:0;height:230px;background:repeating-linear-gradient(100deg,#E2CC98 0 6px,#D9C089 6px 9px,#E8D6A8 9px 16px);opacity:.55;border-top:3px solid #1D1D1D}
.top{position:absolute;left:84px;right:84px;top:76px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-block;border:3px solid #1D1D1D;border-radius:999px;background:#FFFCF6;padding:8px 20px;font-weight:800;font-size:26px}
.chip.o{background:#E49A4A;color:#fff}
.brand{font-family:A;font-size:30px}
.box{position:absolute;background:#FFFCF6;border:4px solid #1D1D1D;border-radius:28px;box-shadow:8px 8px 0 #1D1D1D}
.foot{position:absolute;left:84px;right:84px;bottom:70px;display:flex;justify-content:space-between;align-items:center}
.cta{border:4px solid #1D1D1D;border-radius:18px;background:#E49A4A;color:#fff;font-weight:800;font-size:34px;padding:16px 30px;box-shadow:6px 6px 0 #1D1D1D}
.m{width:120px;height:120px}

.kick{position:absolute;left:84px;top:190px;font-weight:800;font-size:34px;color:#B5651D}
.t{position:absolute;left:78px;top:262px;font-family:A;font-size:230px;line-height:1;letter-spacing:-.02em;color:#1D1D1D;text-shadow:7px 7px 0 #E49A4A}
.q{position:absolute;left:84px;top:545px;font-family:A;font-size:56px;line-height:1.3}
.q em{font-style:normal;color:#B5651D}
.lockwrap{position:absolute;right:70px;top:190px;transform:rotate(12deg)}
.zzz{position:absolute;right:300px;top:170px;font-family:A;font-size:60px;color:#B5651D;transform:rotate(-8deg)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;}
.cell{padding:26px 30px;border-right:3px dashed rgba(29,29,29,.2)}
.cell:last-child{border-right:0}
.l{font-weight:800;font-size:24px;color:#8A7A60}
.v{margin-top:8px;font-family:A;font-size:44px}
.n{margin-top:6px;font-weight:500;font-size:22px;color:#6E6250}
.hl{padding:22px 30px;border-top:3px solid #1D1D1D;font-weight:800;font-size:30px;display:flex;gap:14px;align-items:center}
</style></head><body><div class="bg"></div><div class="paper"></div><div class="straw"></div>

</svg></div>

</body></html>
