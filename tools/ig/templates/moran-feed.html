<!doctype html><html><head><meta charset="utf-8"><style>
/* 셜록홈즈 모란점 12월 오픈 기대(성남 주민 시점). 정보는 매장 공식 인스타(@sherlock_moran) 소개글 기준: 모란역 · 100평 · 8개 테마 · 12월 그랜드오픈.
   매장 사진은 쓰지 않고, 보라 벽·살구색 아랫벽·액자등은 새로 그린 그림이다. */
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#1D1D1D;background:#6b4a86}
.wall{position:absolute;inset:0;background:linear-gradient(#5a3d74,#7a5898 55%)}
.low{position:absolute;left:0;right:0;bottom:0;height:405px;background:#e58f7e;border-top:10px solid #c9705f}
.floor{position:absolute;left:0;right:0;bottom:0;height:135px;background:#cdb8a0;border-top:8px solid #1D1D1D22}
.lamp{position:absolute;top:0px;width:150px;height:18px;border-radius:9px;background:#f3d27a;box-shadow:0 0 0 4px #b98a2e,0 40px 90px 40px #ffe9b033}
.lamp:before{content:"";position:absolute;left:60px;top:-26px;width:30px;height:26px;background:#b98a2e;border-radius:6px 6px 0 0}
.glow{position:absolute;top:20px;width:420px;height:520px;background:radial-gradient(ellipse at 50% 0,#fff2c455,transparent 70%)}
.tag{position:absolute;left:70px;top:110px;background:#F5F0E6;border:5px solid #1D1D1D;border-radius:99px;padding:10px 26px;font:800 30px P;box-shadow:6px 6px 0 #1D1D1D;transform:rotate(-3deg)}
.h{position:absolute;left:70px;right:60px;top:220px;font:400 104px/1.14 A;color:#F5F0E6;text-shadow:7px 7px 0 #1D1D1D}
.h em{font-style:normal;color:#ffd166}
.card{position:absolute;left:70px;right:70px;top:610px;background:#F5F0E6;border:6px solid #1D1D1D;border-radius:30px;box-shadow:12px 12px 0 #1D1D1D;padding:34px 38px;transform:rotate(1.2deg)}
.card:before{content:"";position:absolute;left:60px;top:-24px;width:170px;height:42px;background:#E49A4A;opacity:.9;transform:rotate(-4deg)}
.row{display:flex;gap:16px;margin-bottom:8px}
.f{flex:1;background:#fff;border:4px solid #1D1D1D;border-radius:20px;padding:16px 10px;text-align:center}
.f b{display:block;font:400 54px A;color:#E07A2B}.f span{font:800 24px P;color:#6B6258}
.say{font:400 50px/1.3 A;margin-top:22px}
.say small{display:block;font:500 28px/1.5 P;color:#6B6258;margin-top:10px}
.ghost{position:absolute;right:60px;bottom:155px;width:230px;transform:rotate(8deg);filter:drop-shadow(8px 10px 0 #0005)}
.heart{position:absolute;font-size:64px}
.ft{position:absolute;left:70px;right:70px;bottom:44px;display:flex;justify-content:space-between;font:800 24px P;color:#3b2a1f}
</style></head><body>
<div class="wall"></div>
<div class="glow" style="left:60px"></div><div class="glow" style="left:560px"></div>
<div class="lamp" style="left:200px"></div><div class="lamp" style="left:700px"></div>
<div class="low"></div><div class="floor"></div>
<div class="tag">📍 성남 주민 속보</div>
<div class="h">모란에<br><em>셜록홈즈</em>가<br>온대요…!</div>
<div class="card">
<div class="row"><div class="f"><b>12월</b><span>그랜드 오픈</span></div><div class="f"><b>8개</b><span>테마</span></div><div class="f"><b>100평</b><span>모란역</span></div></div>
<div class="say">성남 사는 사람으로서<br>넘모 기대 중 🥹💜<small>이제 방탈출 하러 서울·수원까지 안 가도 된다…!<br>공식 계정 간판 글자 속에 <b style="color:#1D1D1D">단서</b>가 숨어 있다던데 🔍</small></div>
</div>
<img class="ghost" src="../../../public/mascot.png">
<div class="ft"><span>정보: 셜록홈즈 모란점 공식 인스타 소개 기준 · 그림은 탈깍노트가 그렸어요</span><span>탈깍노트</span></div>
</body></html>
