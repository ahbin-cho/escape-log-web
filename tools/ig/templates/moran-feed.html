<!doctype html><html><head><meta charset="utf-8"><style>
/* 셜록홈즈 모란점 12월 오픈 기대(성남 주민 시점). 배경은 제미나이 그림(탐정 책상, 보라·살구). 정보는 매장 공식 인스타(@sherlock_moran) 소개글 기준.
   매장 사진·로고는 쓰지 않는다. 탈출귀는 원래 그림(모자 X, 운영자 피드백) — 셜록 탈출귀 그림이 오면 교체. */
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#1D1D1D;background:#2f2140 url(../assets/moran-bg-feed.jpg) 0 0/1080px 1350px}
.tag{position:absolute;left:70px;top:76px;background:#F5F0E6;border:5px solid #1D1D1D;padding:10px 24px;font:400 34px A;letter-spacing:.06em;transform:rotate(-4deg);box-shadow:7px 7px 0 #000}
.tag:before{content:"";position:absolute;left:-26px;top:-16px;width:90px;height:34px;background:#ff7aa8;opacity:.95;transform:rotate(-18deg)}
.h{position:absolute;left:66px;top:170px;font:400 104px/1 A;color:#F5F0E6;text-shadow:8px 8px 0 #000}
.h em{font-style:normal;color:#ff9ec4;font-size:200px;display:block;margin-top:14px;text-shadow:10px 10px 0 #000}
.stamp{position:absolute;right:70px;top:440px;font:400 60px/1.05 A;color:#ff5c93;border:9px solid #ff5c93;border-radius:16px;padding:10px 22px;transform:rotate(9deg);text-align:center;background:#2f2140e6}
.stamp small{display:block;font:800 26px P;letter-spacing:.1em}
.row{position:absolute;left:66px;top:560px;display:flex;gap:16px}
.f{background:#fffaf0;border:4px solid #1D1D1D;border-radius:14px;padding:10px 22px;text-align:center;box-shadow:6px 6px 0 #1D1D1D}
.f:nth-child(1){transform:rotate(-3deg)}.f:nth-child(2){transform:rotate(2deg)}.f:nth-child(3){transform:rotate(-1deg)}
.f b{display:block;font:400 52px A;color:#d6336c}.f span{font:800 22px P}
.say{position:absolute;left:350px;top:870px;width:380px;transform:rotate(-2deg);font:400 48px/1.3 A;color:#3a2452;text-align:center}
.say small{display:block;font:800 25px/1.45 P;color:#8a5a70;margin-top:14px}
.ghost{position:absolute;left:650px;top:95px;width:230px;transform:rotate(10deg);filter:drop-shadow(6px 8px 0 #000)}
.ft{position:absolute;left:40px;right:40px;bottom:30px;display:flex;justify-content:space-between;font:800 21px P;color:#F5F0E6;text-shadow:0 2px 4px #000}
</style></head><body>
<div class="tag">성남 주민 제보</div>
<div class="h">모란에 상륙!<em>셜록홈즈</em></div>
<div class="stamp">12월<small>GRAND OPEN</small></div>
<div class="row"><div class="f"><b>8건</b><span>의 사건(테마)</span></div><div class="f"><b>100평</b><span>성남 최대 규모</span></div><div class="f"><b>모란역</b><span>사건 현장</span></div></div>
<div class="say">성남 사람으로서<br>넘모 기대 중 🥹<small>오픈하면 제일 먼저<br>달려갈 사람 🙋</small></div>
<img class="ghost" src="../../../public/mascot.png">
<div class="ft"><span>정보: 셜록홈즈 모란점 공식 인스타 소개 기준 · 그림은 탈깍노트</span><span>탈깍노트</span></div>
</body></html>
