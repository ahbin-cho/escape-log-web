<!doctype html><html><head><meta charset="utf-8"><style>
/* 몽염 릴스 v2(13초): 멀리 선 그녀 → (깜빡) 가까이 → (깜빡) 더 가까이 → 암전 → 어둠에서 뻗는 손 → 감싸는 손 → 제목.
   자막은 매장 공식 줄거리 그대로, "도망칠 수 없는 꿈"은 공식 부제. 그림은 운영자가 제미나이로 뽑은 5장(assets/mong-*.jpg, 공식 포스터 그림체 참고·새 장면).
   소리: drawings/mongyeom2_sfx.py */
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:P}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
@keyframes in{to{opacity:1}} @keyframes out{to{opacity:0}}
.cam{position:absolute;inset:0;animation:shake .5s 7.6s steps(8)}
@keyframes shake{0%{translate:0 0}15%{translate:-22px 14px}30%{translate:18px -16px}45%{translate:-14px -10px}60%{translate:12px 12px}80%{translate:-6px 4px}100%{translate:0 0}}
.sc{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0}
.far{background-image:url(../assets/mong-far.jpg);opacity:1;transform-origin:50% 76%;animation:z1 1.7s linear forwards,out .01s 1.7s forwards}
.mid{background-image:url(../assets/mong-mid.jpg);transform-origin:50% 72%;animation:in .01s 1.7s forwards,z2 1.5s 1.7s linear forwards,out .01s 3.2s forwards}
.near{background-image:url(../assets/mong-near.jpg);transform-origin:50% 55%;animation:in .01s 3.2s forwards,z3 2.4s 3.2s linear forwards,out .01s 5.6s forwards}
.hands{background-image:url(../assets/mong-hands.jpg);transform-origin:50% 62%;animation:in .01s 6.1s forwards,z4 1.5s 6.1s cubic-bezier(.6,0,.9,.5) forwards,out .01s 7.5s forwards}
.wrap{background-image:url(../assets/mong-wrap.jpg);transform-origin:50% 45%;animation:in .01s 7.6s forwards,z5 5.4s 7.6s cubic-bezier(.1,.6,.3,1) forwards}
@keyframes z1{from{transform:scale(1.04)}to{transform:scale(1.1)}}
@keyframes z2{from{transform:scale(1.06)}to{transform:scale(1.12)}}
@keyframes z3{from{transform:scale(1.06)}to{transform:scale(1.2)}}
@keyframes z4{from{transform:scale(1.02)}to{transform:scale(1.45)}}
@keyframes z5{from{transform:scale(1.4)}to{transform:scale(1.08)}}
.top{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.7) 0,rgba(0,0,0,.35) 560px,transparent 800px);z-index:3}
.wh{position:absolute;inset:0;background:#fff;opacity:0;z-index:4;animation:wf .9s 7.6s}
@keyframes wf{0%{opacity:.55}100%{opacity:0}}
/* 깜빡: 멀리→가까이(1.62), 가까이→더 가까이(3.1), 암전(5.6~6.1), 감싸기 직전(7.47), 끝 화면 어둡게(9.2~) */
.black{position:absolute;inset:0;background:#000;opacity:0;z-index:20;animation:bo2 .1s 1.62s,bo2 .12s 3.1s,bo .55s 5.58s,bo2 .14s 7.47s,endd .7s 9.2s forwards}
@keyframes bo{0%{opacity:0}10%,90%{opacity:1}100%{opacity:0}} @keyframes bo2{0%,100%{opacity:1}} @keyframes endd{to{opacity:.86}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.7));z-index:5}
.grain{position:absolute;inset:-50%;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:7px 9px;animation:gr .18s steps(3) infinite;mix-blend-mode:screen;z-index:15}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-11px,7px)}66%{transform:translate(9px,-5px)}}
.pale{font-family:M;color:#ECECEC;text-shadow:0 3px 18px #000,0 0 6px #000}
.acc{color:#fff;text-shadow:0 0 26px rgba(255,255,255,.55),0 3px 14px #000}
.hook{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:30;animation:out .1s 1.6s forwards}
.hook .a{font-size:78px;opacity:0;animation:in .5s .15s forwards}.hook .b{font-size:104px;margin-top:24px;opacity:0;animation:in .4s .85s forwards}
.w{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;opacity:0;filter:blur(10px);letter-spacing:.28em;z-index:25;animation:wr .8s var(--t) cubic-bezier(.2,.7,.3,1) forwards,out .1s 5.56s forwards}
@keyframes wr{to{opacity:1;filter:blur(0);letter-spacing:.08em}}
.say{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:104px;line-height:1.25;letter-spacing:.06em;z-index:25;opacity:0;animation:pop .25s 7.9s forwards,out .4s 9.1s forwards}
@keyframes pop{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:none}}
.meta{position:absolute;left:84px;top:1000px;z-index:25}
.meta>div{opacity:0;animation:in .6s 10s forwards}
.meta .t{font-family:M;font-size:230px;line-height:1;color:#fff;letter-spacing:.12em;text-shadow:0 0 30px rgba(255,255,255,.35);animation:tin 1.2s 9.4s cubic-bezier(.2,.7,.3,1) forwards;filter:blur(18px)}
@keyframes tin{to{opacity:1;filter:blur(0)}}
.meta .s{font-family:M;font-size:44px;margin-top:14px;letter-spacing:.3em;color:#ECECEC}
.meta .k{font-weight:800;font-size:38px;color:#EDE6DA;margin-top:34px}
.meta .c{font-weight:800;font-size:33px;color:#B9B3AA;margin-top:10px}
.post{position:absolute;right:84px;top:1020px;width:236px;opacity:0;animation:in .7s 10.2s forwards;z-index:25}
.post img{display:block;width:236px;border:2px solid rgba(237,230,218,.3)}
.post div{font-weight:500;font-size:20px;color:#9F998F;margin-top:8px;text-align:right}
.cta{position:absolute;left:72px;right:72px;top:1560px;display:flex;align-items:center;gap:24px;background:#F5F0E6;border:5px solid #1D1D1D;border-radius:30px;padding:22px 30px;box-shadow:8px 9px 0 #1D1D1D;opacity:0;transform:translateY(50px);animation:card .6s 11s cubic-bezier(.22,1,.36,1) forwards;z-index:40}
@keyframes card{to{opacity:1;transform:none}}
.cta .x{color:#1D1D1D;font-weight:800;font-size:44px;letter-spacing:-.03em}.cta .x b{color:#E0782A}
.cta .s{color:#6B665D;font-weight:500;font-size:28px;margin-top:6px}
</style></head><body><div class="stage">
<div class="cam"><div class="sc far"></div><div class="sc mid"></div><div class="sc near"></div><div class="sc hands"></div><div class="sc wrap"></div></div>
<div class="top"></div><div class="wh"></div><div class="vig"></div><div class="grain"></div><div class="black"></div>
<div class="hook pale"><div class="a">매일 밤 같은 꿈,</div><div class="b acc">같은 그녀.</div></div>
<div class="w pale" style="top:290px;font-size:78px;--t:1.9s">나는 매일 꿈을 꾸었다.</div>
<div class="w pale" style="top:410px;font-size:66px;--t:3.4s">온통 어두운 곳에서</div>
<div class="w pale" style="top:505px;font-size:66px;--t:3.9s">그녀가 날 바라보는 꿈.</div>
<div class="w pale acc" style="top:640px;font-size:72px;--t:4.6s">그저 바라만 보고 있었다.</div>
<div class="say pale acc">도망칠 수<br>없는 꿈</div>
<div class="meta"><div class="t">몽염</div><div class="s">도망칠 수 없는 꿈</div><div class="k">상상의문 분당서현점</div><div class="c">공포 · 난이도 4/5 · 공포도 4/5</div></div>
<div class="post"><img src="../assets/poster-mongyeom-official.jpg"><div>포스터: 상상의문 공식</div></div>
<div class="cta"><img src="../../../public/mascot.png" width="110" height="110"><div><div class="x">다녀왔다면 <b>후기 남기기</b></div><div class="s">줄거리·후기는 프로필 링크 · talkkaknote.com</div></div></div>
</div></body></html>
