<!doctype html><html><head><meta charset="utf-8"><style>
/* 운영자 노트: 셔플월드(상상의문 분당서현점) 다녀온 기록 표지. 사진은 운영자가 매장에서 직접 찍은 것(assets/shuffle-store.jpg).
   글은 운영자가 리뷰 시트에 적은 내용 그대로. 2장은 사이트에서 만든 리뷰 시트(assets/shuffle-review-sheet.jpg)를 그대로 쓴다. */
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#1D1D1D;background:url(../assets/shuffle-store.jpg) center bottom/cover}
.chip{position:absolute;left:56px;top:56px;background:#E49A4A;border:5px solid #1D1D1D;border-radius:999px;padding:8px 26px;font:400 38px A;box-shadow:6px 6px 0 #1D1D1D}
.note{position:absolute;right:56px;top:62px;background:#F5F0E6;border:4px solid #1D1D1D;border-radius:999px;padding:6px 20px;font:800 26px P}
.box{position:absolute;left:48px;right:48px;bottom:56px;background:#F5F0E6;border:6px solid #1D1D1D;border-radius:30px;box-shadow:10px 10px 0 #1D1D1D;padding:22px 34px}
.box h1{font:400 84px/1.08 A}.box h1 em{font-style:normal;color:#D9822B}
.say{position:absolute;left:60px;top:160px;background:#F5F0E6;border:5px solid #1D1D1D;border-radius:22px;padding:12px 24px;font:400 46px A;box-shadow:6px 6px 0 #1D1D1D;transform:rotate(-3deg)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.row span{background:#FFE7C4;border:4px solid #1D1D1D;border-radius:999px;padding:6px 18px;font:800 28px P}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:500 25px P;color:#6B6258}
.ft b{font:400 28px A;color:#1D1D1D}
</style></head><body>
<div class="chip">13번째 방</div><div class="note">운영자 노트 ✏️</div><div class="say">일어나라 용사여 ⚔️</div>
<div class="box"><h1><em>셔플월드</em> 다녀왔다</h1>
<div class="row"><span>탈출 성공</span><span>2분 30초 남기고</span><span>2명</span><span>힌트 4개</span></div>
<div class="ft"><span>📍 상상의문 분당서현점 · 모험</span><b>리뷰는 다음 장 👉</b></div></div>
</body></html>
