<!doctype html><html><head><meta charset="utf-8"><style>
/* 춘화각 릴스 v2(12초): 닫힌 끝방 문 → 끼익 열림 → 여인 → 촛불 꺼짐(암전) → 빈 방 → 코앞에 나타남 → 제목. 대사는 매장 공식 줄거리 그대로.
   소리: drawings/chunhwa2_sfx.py. 그림 레이어는 poster_moods.py 가 그린 것(제미나이 그림이 오면 바꿔 끼운다). */
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2)}
@font-face{font-family:B;src:url(../assets/fonts/nanum-brush-script-korean-400-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:P}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
@keyframes in{to{opacity:1}} @keyframes out{to{opacity:0}}
/* 방(카메라): 문이 열릴 때 살짝 다가가고, 코앞 등장 때 흔들린다 */
.cam{position:absolute;inset:0;transform-origin:50% 46%;transform:scale(1.25);animation:push 3.6s 2s cubic-bezier(.2,.6,.2,1) forwards,shake .5s 7.2s steps(8)}
@keyframes push{from{transform:scale(1.25)}to{transform:scale(1.42)}}
@keyframes shake{0%{translate:0 0}15%{translate:-22px 14px}30%{translate:18px -16px}45%{translate:-14px -10px}60%{translate:12px 12px}80%{translate:-6px 4px}100%{translate:0 0}}
.room,.woman,.rope{position:absolute;inset:0;background-size:cover;background-position:center}
.room{background-image:url(../assets/reel-chunhwa-empty.jpg);filter:brightness(1.5) saturate(1.2)}
.woman{background-image:url(../assets/reel-chunhwa-woman.png);filter:brightness(1.25);animation:out .01s 5.6s forwards}
.rope{background-image:url(../assets/reel-chunhwa-rope.png);transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite alternate,wild .22s 6.1s 12 alternate}
@keyframes sway{0%{transform:rotate(-.7deg) skewX(-.6deg)}100%{transform:rotate(.8deg) skewX(.7deg)}}
@keyframes wild{0%{transform:rotate(-1.6deg) skewX(-1.6deg)}100%{transform:rotate(1.7deg) skewX(1.8deg)}}
.candle{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(255,150,70,.34),rgba(255,120,60,.08) 40%,transparent 65%);mix-blend-mode:screen;animation:cf 1.7s steps(9) infinite,out .15s 5.6s forwards}
@keyframes cf{0%{opacity:.9}12%{opacity:.55}25%{opacity:1}38%{opacity:.7}50%{opacity:.95}62%{opacity:.5}75%{opacity:.85}88%{opacity:.65}100%{opacity:.9}}
.cold{position:absolute;inset:0;background:rgba(20,30,80,.35);mix-blend-mode:multiply;opacity:0;animation:in .01s 6.1s forwards}
/* 코앞의 여인 */
.close{position:absolute;inset:0;background:url(../assets/reel-chunhwa-woman.png) center/cover;transform-origin:50% 44%;transform:scale(3.1) translateY(150px);filter:brightness(.8) contrast(1.2);opacity:0;animation:in .01s 7.2s forwards,creep 2s 7.2s linear forwards,out .5s 8.7s forwards}
@keyframes creep{to{transform:scale(3.5) translateY(165px)}}
.red{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(190,10,20,.75));opacity:0;animation:rf 1.5s 7.2s}
@keyframes rf{0%{opacity:1}100%{opacity:0}}
/* 암전: 촛불 꺼짐(5.6~6.1), 코앞 직전 깜빡(7.05), 끝 화면 어둡게(8.7~) */
.black{position:absolute;inset:0;background:#000;opacity:0;z-index:20;animation:bo .5s 5.6s,bo2 .15s 7.05s,endd .5s 8.7s forwards}
@keyframes bo{0%{opacity:0}12%,88%{opacity:1}100%{opacity:0}} @keyframes bo2{0%,100%{opacity:1}} @keyframes endd{to{opacity:.72}}
/* 문 두 짝(창호) */
.door{position:absolute;top:0;bottom:0;width:545px;z-index:10;background-color:#150c1c;
  background-image:linear-gradient(#2a1a33 0 0),repeating-linear-gradient(90deg,#3a2742 0 8px,transparent 8px 128px),repeating-linear-gradient(0deg,#3a2742 0 8px,transparent 8px 150px);
  background-size:100% 100%,100% 62%,100% 62%;background-position:0 0,0 14%,0 14%;background-repeat:no-repeat;background-blend-mode:normal;box-shadow:inset 0 0 0 16px #0d0712,inset 0 0 120px #000}
.door.l{left:0;animation:dl 1.3s 2s cubic-bezier(.5,0,.2,1) forwards}.door.r{right:0;animation:dr 1.3s 2s cubic-bezier(.5,0,.2,1) forwards}
@keyframes dl{to{transform:translateX(-560px)}} @keyframes dr{to{transform:translateX(560px)}}
.door:after{content:"";position:absolute;inset:14% 40px 24% 40px;background:rgba(235,221,240,.07)}
.slit{position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;z-index:11;background:#ffb070;box-shadow:0 0 60px 18px rgba(255,140,60,.55);animation:cf 1.3s steps(7) infinite,out .3s 2s forwards}
.grain{position:absolute;inset:-50%;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:7px 9px;animation:gr .18s steps(3) infinite;mix-blend-mode:screen;z-index:15}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-11px,7px)}66%{transform:translate(9px,-5px)}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(0,0,0,.8));z-index:14}
/* 글자 */
.pale{font-family:M;color:#F3E8F6;text-shadow:0 3px 18px #000,0 0 6px #000}
.acc{color:#FF4048;text-shadow:0 0 22px rgba(224,51,58,.55),0 3px 14px #000}
.hook{position:absolute;left:0;right:0;top:640px;text-align:center;z-index:30;animation:out .3s 1.9s forwards}
.hook .a{font-size:70px;opacity:0;animation:in .5s .2s forwards}.hook .b{font-size:84px;margin-top:26px;opacity:0;animation:in .6s .9s forwards}
.w{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;opacity:0;filter:blur(10px);letter-spacing:.28em;z-index:25;animation:wr .8s var(--t) cubic-bezier(.2,.7,.3,1) forwards,out .1s 5.6s forwards}
@keyframes wr{to{opacity:1;filter:blur(0);letter-spacing:.08em}}
.say{position:absolute;left:0;right:0;top:1290px;text-align:center;font-size:88px;z-index:25;opacity:0;animation:pop .25s 7.35s forwards,out .4s 8.7s forwards}
@keyframes pop{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:none}}
.meta{position:absolute;left:84px;top:1010px;z-index:25}
.meta>div{opacity:0;animation:in .6s 9.5s forwards}
.meta .t{font-family:B;font-size:250px;line-height:.9;color:#FF4048;opacity:1;clip-path:inset(-10% 100% -10% 0);animation:brush 1s 9s cubic-bezier(.3,0,.2,1) forwards}
@keyframes brush{to{clip-path:inset(-10% -5% -10% 0)}}
.meta .s{font-family:M;font-size:46px;margin-top:6px;letter-spacing:.3em;color:#F3E8F6}
.meta .k{font-weight:800;font-size:38px;color:#EDE6DA;margin-top:30px}
.meta .c{font-weight:800;font-size:33px;color:#B9B3AA;margin-top:10px}
.meta .n{font-weight:500;font-size:26px;color:#9F998F;margin-top:10px}
.post{position:absolute;right:84px;top:1080px;width:230px;opacity:0;animation:in .7s 9.7s forwards;z-index:25}
.post img{display:block;width:230px;border:2px solid rgba(237,230,218,.3)}
.post div{font-weight:500;font-size:20px;color:#9F998F;margin-top:8px;text-align:right}
.cta{position:absolute;left:72px;right:72px;top:1560px;display:flex;align-items:center;gap:24px;background:#F5F0E6;border:5px solid #1D1D1D;border-radius:30px;padding:22px 30px;box-shadow:8px 9px 0 #1D1D1D;opacity:0;transform:translateY(50px);animation:card .6s 10.5s cubic-bezier(.22,1,.36,1) forwards;z-index:40}
@keyframes card{to{opacity:1;transform:none}}
.cta .x{color:#1D1D1D;font-weight:800;font-size:44px;letter-spacing:-.03em}.cta .x b{color:#E0782A}
.cta .s{color:#6B665D;font-weight:500;font-size:28px;margin-top:6px}
</style></head><body><div class="stage">
<div class="cam"><div class="room"></div><div class="candle"></div><div class="woman"></div><div class="rope"></div><div class="cold"></div></div>
<div class="close"></div><div class="red"></div><div class="vig"></div>
<div class="door l"></div><div class="door r"></div><div class="slit"></div>
<div class="grain"></div><div class="black"></div>
<div class="hook pale"><div class="a">그 소문 들었어?</div><div class="b acc">그 여인과 하룻밤을 지내면…</div></div>
<div class="w pale" style="top:250px;font-size:80px;--t:3.2s">자네도 장원 급제를 위해서</div>
<div class="w pale" style="top:380px;font-size:80px;--t:4.1s">이 춘화각을 찾았는가?</div>
<div class="say pale acc">이쪽 끝방으로<br>들어가시게.</div>
<div class="meta"><div class="t">춘화각</div><div class="s">피할 수 없는 저주</div><div class="k">상상의문 수원 2호점</div><div class="c">공포 · 난이도 3/5 · 공포도 4/5</div><div class="n">직원 NPC와 함께하는 테마(매장 공식 안내)</div></div>
<div class="post"><img src="../assets/poster-chunhwa-official.jpg"><div>포스터: 상상의문 공식</div></div>
<div class="cta"><img src="../../../public/mascot.png" width="110" height="110"><div><div class="x">다녀왔다면 <b>후기 남기기</b></div><div class="s">줄거리·후기는 프로필 링크 · talkkaknote.com</div></div></div>
</div></body></html>
