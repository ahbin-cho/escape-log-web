<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d0b0a;font-family:P;color:#F5F0E6}
#cam{position:absolute;inset:0;transform-origin:50% 58%;transition:transform 11s cubic-bezier(.3,0,.6,1)}
/* room */
#wall{position:absolute;inset:0;background:
 repeating-linear-gradient(90deg,#00000055 0 4px,transparent 4px 180px),
 repeating-linear-gradient(0deg,#2b211a 0 92px,#261d17 92px 96px),#2b211a}
#floor{position:absolute;left:0;right:0;top:1380px;bottom:0;background:linear-gradient(#1a1410,#0c0908);border-top:6px solid #120d0a}
.frame{position:absolute;border:14px solid #3d2d20;background:#1c1612;box-shadow:inset 0 0 40px #000}
#light{position:absolute;inset:0;background:radial-gradient(circle at var(--lx,540px) var(--ly,1060px),#ffe2a822 0,#ffd27a14 260px,#00000000 520px),radial-gradient(ellipse at 50% 55%,transparent 30%,#000000dd 85%);mix-blend-mode:normal;transition:background 0s}
#warm{position:absolute;inset:0;background:radial-gradient(circle at 540px 1050px,#fff4d6 0,#F5E6C8 45%,#e9cf9f 100%);opacity:0}
/* chest */
#chest{position:absolute;left:150px;top:1060px;width:780px;height:470px}
.lid{position:absolute;left:-20px;right:-20px;top:-70px;height:120px;border-radius:40px 40px 8px 8px;background:linear-gradient(#6d4a2c,#4e3420);border:8px solid #1d130c;box-shadow:inset 0 10px 0 #8a6240}
.box{position:absolute;inset:40px 0 0 0;background:repeating-linear-gradient(0deg,#5b3d24 0 70px,#4a311d 70px 76px);border:8px solid #1d130c;border-radius:8px;box-shadow:0 30px 60px #000a}
.band{position:absolute;top:-70px;bottom:0;width:60px;background:linear-gradient(90deg,#6c6152,#b5a68c 40%,#6c6152);border:6px solid #1d130c}
.hasp{position:absolute;left:340px;top:0;width:100px;height:150px;background:linear-gradient(90deg,#6c6152,#c9b998 45%,#6c6152);border:6px solid #1d130c;border-radius:10px}
/* lock */
#lock{position:absolute;left:300px;top:930px;width:480px;height:520px;transform-origin:50% 0}
.shackle{position:absolute;left:105px;top:0;width:270px;height:280px;border:44px solid transparent;border-bottom:none;border-radius:140px 140px 0 0;box-sizing:border-box;
 background:linear-gradient(90deg,#7d838a,#e8edf2 35%,#9aa0a7 60%,#5f646a) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;transition:transform .45s cubic-bezier(.2,1.8,.4,1)}
.open .shackle{transform:translateY(-110px)}
.lbody{position:absolute;left:0;top:200px;width:480px;height:320px;border-radius:40px;background:linear-gradient(160deg,#f3c76a,#d79a35 45%,#a8701f 80%,#7d5214);border:9px solid #1d130c;box-sizing:border-box;box-shadow:inset 0 14px 0 #ffe3a066,inset 0 -18px 0 #0003,18px 22px 0 #000b}
.lbody:after{content:"";position:absolute;left:30px;top:24px;width:140px;height:26px;border-radius:20px;background:#fff6;filter:blur(4px)}
.wheels{position:absolute;left:38px;top:105px;display:flex;gap:14px}
.w{width:88px;height:140px;border-radius:14px;overflow:hidden;position:relative;background:#16120e;border:6px solid #1d130c}
.col{position:absolute;left:0;right:0;top:0;transition:transform .55s cubic-bezier(.25,.1,.25,1)}
.col span{display:block;height:140px;text-align:center;font:400 86px/140px A;color:#efe6d3}
.w:after{content:"";position:absolute;inset:0;background:linear-gradient(#000d,#0000 32%,#fff1 50%,#0000 68%,#000d)}
.notch{position:absolute;left:30px;right:30px;top:96px;height:6px;background:#1d130c;border-radius:3px}
/* timer panel */
#panel{position:absolute;left:250px;top:300px;width:580px;height:230px;background:#0b0908;border:12px solid #3a3a3a;border-radius:24px;box-shadow:0 0 0 6px #111,0 20px 40px #000}
#timer{position:absolute;inset:0;text-align:center;font:400 170px/230px A;color:#ff3b30;letter-spacing:8px;text-shadow:0 0 30px #ff3b30aa,0 0 80px #ff3b3055}
#panel.hot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #111,0 0 120px #ff3b3088}}
#redwash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,#7a0b0b88);opacity:0;transition:opacity 1.5s}
/* caption */
.cap{position:absolute;left:0;right:0;top:640px;text-align:center;font:400 78px/1.2 A;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s;text-shadow:0 4px 20px #000}
.cap.on{opacity:1;transform:none}
#ghost{position:absolute;left:720px;top:1470px;width:300px;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
#ghost.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.jig{animation:jig .32s ease-out}
@keyframes jig{20%{transform:translateY(22px) rotate(-2deg)}45%{transform:translateY(6px) rotate(1.5deg)}70%{transform:translateY(12px)}100%{transform:none}}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9b8;opacity:.0}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0;pointer-events:none}
#big{position:absolute;left:0;right:0;top:560px;text-align:center;font:400 250px/1 A;color:#1D1D1D;opacity:0;transform:scale(.4) rotate(-8deg);-webkit-text-stroke:0;text-shadow:12px 12px 0 #E49A4A}
#end{position:absolute;left:0;right:0;top:1680px;text-align:center;opacity:0;transform:translateY(30px);transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#end b{display:inline-block;font:400 54px A;background:#E49A4A;color:#1D1D1D;border:6px solid #1D1D1D;border-radius:24px;padding:12px 36px;box-shadow:9px 9px 0 #1D1D1D}
.conf{position:absolute;width:22px;height:34px;opacity:0;border-radius:3px}
</style></head><body>
<div id="cam">
 <div id="wall"></div>
 <div class="frame" style="left:70px;top:150px;width:170px;height:230px"></div>
 <div class="frame" style="left:860px;top:640px;width:150px;height:190px"></div>
 <div id="floor"></div>
 <div id="warm"></div>
 <div id="panel"><div id="timer">00:12</div></div>
 <div id="chest"><div class="lid"></div><div class="box"></div><div class="band" style="left:80px"></div><div class="band" style="right:80px"></div><div class="hasp"></div></div>
 <div id="lock"><div class="shackle"></div><div class="lbody"><div class="wheels"></div></div></div>
 <div id="light"></div>
 <div id="redwash"></div>
 <img id="ghost" class="bob" src="../../../public/mascot.png">
</div>
<div class="cap" id="c1">마지막 자물쇠</div>
<div class="cap" id="c2">친구: “일단 0000 해 봐”</div>
<div class="cap" id="c3">나: 잠깐만…</div>
<div id="big">탈깍!</div>
<div id="end"><b>남은 시간 00:01</b></div>
<div id="flash"></div>
<script>
const $=s=>document.querySelector(s),T=(ms,f)=>setTimeout(f,ms);
// wheels
const W=$('.wheels'),cols=[];
for(let i=0;i<4;i++){const w=document.createElement('div');w.className='w';const c=document.createElement('div');c.className='col';
 for(let k=0;k<20;k++){const s=document.createElement('span');s.textContent=k%10;c.appendChild(s)}w.appendChild(c);W.appendChild(w);cols.push({el:c,pos:0})}
const setW=(i,d)=>{const c=cols[i];let p=c.pos;while(p%10!==d)p++;c.pos=p;c.el.style.transform=`translateY(${-p*140}px)`};
// dust
for(let i=0;i<40;i++){const d=document.createElement('div');d.className='dust';$('#cam').appendChild(d);
 const x=200+Math.random()*700,y=700+Math.random()*900,s=.5+Math.random()*1.4;d.style.left=x+'px';d.style.top=y+'px';d.style.transform=`scale(${s})`;
 d.animate([{opacity:0,transform:`translate(0,0) scale(${s})`},{opacity:.35,offset:.3},{opacity:.25,offset:.7},{opacity:0,transform:`translate(${(Math.random()-.5)*160}px,${-80-Math.random()*160}px) scale(${s})`}],{duration:5000+Math.random()*5000,delay:Math.random()*3000,iterations:Infinity})}
// flashlight sweep
const L=$('#light');let t0=performance.now(),lightOn=true;
(function loop(){if(!lightOn)return;const t=(performance.now()-t0)/1000;L.style.setProperty('--lx',(540+Math.sin(t*.7)*120)+'px');L.style.setProperty('--ly',(1080+Math.cos(t*.9)*60)+'px');requestAnimationFrame(loop)})();
// camera push
requestAnimationFrame(()=>requestAnimationFrame(()=>$('#cam').style.transform='scale(1.14)'));
// timer real time
const timer=$('#timer');for(let s=11;s>=1;s--)T((12-s)*1000,()=>{timer.textContent='00:'+String(s).padStart(2,'0');if(s===5){$('#panel').classList.add('hot');$('#redwash').style.opacity=1}});
const cap=(id,on)=>$(id).classList.toggle('on',on);
const lock=$('#lock'),ghost=$('#ghost');
const jiggle=()=>{lock.classList.remove('jig');void lock.offsetWidth;lock.classList.add('jig')};
T(300,()=>cap('#c1',true));
T(2000,()=>{cap('#c1',false);T(250,()=>cap('#c2',true))});
T(2900,jiggle);
T(3900,()=>{cap('#c2',false);T(250,()=>cap('#c3',true))});
T(4400,()=>setW(0,1));T(5100,()=>setW(1,1));T(5800,()=>setW(2,2));
T(6600,()=>setW(3,4));T(7050,jiggle);
T(7900,()=>setW(3,7));T(8350,jiggle);
T(8600,()=>{$('#c3').textContent='나: 제발…';ghost.classList.remove('bob');ghost.style.transform='scale(.92)'});
T(9500,()=>setW(3,8));T(9950,jiggle);
T(10500,()=>setW(3,9));
T(11250,()=>{ // click
 lightOn=false;cap('#c3',false);lock.classList.add('open');
 const f=$('#flash');f.style.transition='none';f.style.opacity=.9;requestAnimationFrame(()=>{f.style.transition='opacity .7s';f.style.opacity=0});
 $('#warm').style.transition='opacity .6s';$('#warm').style.opacity=.93;$('#light').style.opacity=0;$('#redwash').style.transition='opacity .3s';$('#redwash').style.opacity=0;
 $('#panel').classList.remove('hot');timer.style.color='#1D1D1D';timer.style.textShadow='none';$('#panel').style.background='#F5F0E6';$('#panel').style.borderColor='#1D1D1D';
 $('#cam').style.transition='transform .5s cubic-bezier(.2,1.4,.4,1)';$('#cam').style.transform='scale(1.04)';
 const b=$('#big');b.style.transition='transform .45s cubic-bezier(.2,1.7,.4,1),opacity .15s';b.style.opacity=1;b.style.transform='scale(1) rotate(-4deg)';
 ghost.style.transform='translateY(-120px) rotate(-12deg) scale(1.15)';T(500,()=>{ghost.style.transform='translateY(-40px) rotate(6deg) scale(1.1)'});
 for(let i=0;i<60;i++){const c=document.createElement('div');c.className='conf';c.style.left=(540+(Math.random()-.5)*160)+'px';c.style.top='1050px';
  c.style.background=['#E49A4A','#E2554A','#3E9A6A','#7A68C2','#F5C342'][i%5];document.body.appendChild(c);
  const a=-Math.PI/2+(Math.random()-.5)*2.4,d=500+Math.random()*600;
  c.animate([{opacity:1,transform:'translate(0,0) rotate(0)'},{opacity:1,transform:`translate(${Math.cos(a)*d*.6}px,${Math.sin(a)*d}px) rotate(${360*Math.random()}deg)`,offset:.35},{opacity:.9,transform:`translate(${Math.cos(a)*d*.8}px,${Math.sin(a)*d+900}px) rotate(${900*Math.random()}deg)`}],{duration:2600,easing:'cubic-bezier(.2,.6,.5,1)',fill:'forwards'})}
});
T(12100,()=>{$('#end').style.opacity=1;$('#end').style.transform='none'});
</script></body></html>
