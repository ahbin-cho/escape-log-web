<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:H;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;font-family:P;font-weight:800;overflow:hidden;background:#16237F;color:#fff}
.abs{position:absolute}
.top{position:absolute;inset:0 0 auto 0;height:600px;background:linear-gradient(180deg,#0E1663,#16237F)}
.scene{position:absolute;left:0;top:570px;width:1080px;height:1350px;background:url(../assets/maple-story-bg.jpg) center/cover}
.fade{position:absolute;left:0;right:0;top:560px;height:40px;background:linear-gradient(180deg,#16237F,rgba(22,35,127,0))}
.t{font-family:H;font-weight:400;color:#fff;-webkit-text-stroke:10px #141B5C;paint-order:stroke fill;text-shadow:0 9px 0 #141B5C;line-height:1.14}
.pill{display:inline-block;font-size:28px;border:5px solid #141B5C;border-radius:999px;padding:6px 20px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#141B5C;border:5px solid #141B5C;border-radius:18px;box-shadow:0 6px 0 #141B5C;font-size:30px;padding:8px 18px}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
.tile{position:absolute;width:470px;height:357px;border:7px solid #141B5C;border-radius:24px;background-size:470px auto;box-shadow:0 10px 0 #141B5C,0 0 40px rgba(255,220,120,.35);overflow:hidden}
.tile:after{content:"";position:absolute;inset:0;border-radius:17px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.8)}
.no{position:absolute;left:14px;top:14px;width:50px;height:50px;border-radius:50%;background:#FFE27A;color:#141B5C;border:5px solid #141B5C;font-family:A;font-size:28px;display:flex;align-items:center;justify-content:center;z-index:2}
.cta{position:absolute;width:470px;height:357px;border:7px solid #141B5C;border-radius:24px;background:#FFE27A;box-shadow:0 10px 0 #141B5C;color:#141B5C;text-align:center;box-sizing:border-box;padding-top:44px}
</style></head><body>
<div class="top"></div><div class="scene"></div><div class="fade"></div>
<i class="star" style="left:120px;top:250px"></i><i class="star" style="left:960px;top:230px"></i><i class="star" style="left:880px;top:380px;opacity:.7"></i><i class="star" style="left:520px;top:200px;opacity:.8"></i><i class="star" style="left:1010px;top:470px"></i>
<div class="abs" style="left:60px;top:210px;display:flex;gap:12px">
  <span class="pill" style="font-family:A;background:#fff;color:#141B5C">방탈로그</span>
  <span class="pill" style="background:#FF5C8A;color:#fff">🍁 NEW OPEN</span>
  <span class="pill" style="background:#141B5C;color:#FFE27A;border-color:#FFE27A">홍대</span>
</div>
<div class="abs t" style="left:56px;top:300px;font-size:100px">메이플 세계로 들어가는<br><span style="color:#FFE27A">방탈출 5개</span>가 열렸다!</div>
<div class="abs" style="left:60px;top:540px;display:flex;gap:14px">
  <span class="chip">⏱️ 60분</span><span class="chip">💰 1인 29,000원</span><span class="chip" style="background:#FFC4E0">🎟️ YES24 · 월 오전 10시</span>
</div>
<div class="tile" style="left:60px;top:640px;background-image:url(../../../public/ig-static/maple/2.jpg);background-position:0 -48px"><span class="no">1</span></div>
<div class="tile" style="left:550px;top:640px;background-image:url(../../../public/ig-static/maple/3.jpg);background-position:0 -28px"><span class="no">2</span></div>
<div class="tile" style="left:60px;top:1017px;background-image:url(../../../public/ig-static/maple/4.jpg);background-position:0 -48px"><span class="no">3</span></div>
<div class="tile" style="left:550px;top:1017px;background-image:url(../../../public/ig-static/maple/5.jpg);background-position:0 -28px"><span class="no">4</span></div>
<div class="tile" style="left:60px;top:1394px;background-image:url(../../../public/ig-static/maple/6.jpg);background-position:0 -28px"><span class="no">5</span></div>
<div class="cta" style="left:550px;top:1394px">
  <div class="t" style="font-size:64px;color:#fff;-webkit-text-stroke:8px #141B5C;text-shadow:0 6px 0 #141B5C">어떤 책부터<br>펼칠까?</div>
  <div style="margin-top:18px;font-size:28px">난이도·공포도·인원 정리 👇</div>
</div>
</body></html>
