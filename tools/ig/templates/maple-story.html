<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:H;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;font-family:P;font-weight:800;overflow:hidden;background:#16237F;color:#fff}
.abs{position:absolute}
.top{position:absolute;inset:0 0 auto 0;height:600px;background:linear-gradient(180deg,#0E1663,#16237F)}
.scene{position:absolute;left:0;top:570px;width:1080px;height:1350px;background:url(../assets/maple-story-bg.jpg) center/cover}
.fade{position:absolute;left:0;right:0;top:560px;height:40px;background:linear-gradient(180deg,#16237F,rgba(22,35,127,0))}
.t{font-family:H;font-weight:400;color:#fff;-webkit-text-stroke:11px #141B5C;paint-order:stroke fill;text-shadow:0 10px 0 #141B5C;line-height:1.14}
.pill{display:inline-block;font-size:30px;border:5px solid #141B5C;border-radius:999px;padding:8px 22px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#141B5C;border:6px solid #141B5C;border-radius:22px;box-shadow:0 8px 0 #141B5C;font-size:34px;padding:10px 22px}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
.bud{position:absolute;bottom:200px;width:150px;z-index:8;text-align:center}
.bk{position:relative;margin:0 auto;width:116px;border:6px solid #141B5C;border-radius:24px 28px 28px 24px;box-shadow:0 10px 0 #141B5C,0 0 36px rgba(255,220,120,.5);overflow:hidden}
.bk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(255,255,255,.35)}
.bk:after{content:"";position:absolute;left:30px;top:16px;width:34px;height:14px;border-radius:10px;background:rgba(255,255,255,.55)}
.face{position:absolute;left:16px;right:0;top:50%;height:60px;margin-top:-10px}
.eye{position:absolute;top:0;width:13px;height:18px;border-radius:50%;background:#141B5C}
.eye:after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#fff}
.blush{position:absolute;top:20px;width:20px;height:11px;border-radius:50%;background:#FF7FA8;opacity:.75}
.mouth{position:absolute;left:50%;top:22px;margin-left:-11px;width:22px;height:11px;border:5px solid #141B5C;border-top:0;border-radius:0 0 22px 22px}
.hat{position:absolute;left:50%;transform:translateX(-50%);font-size:52px;z-index:9;filter:drop-shadow(0 5px 0 #141B5C)}
.nm{display:inline-block;margin-top:18px;font-size:24px;color:#141B5C;background:#fff;border:5px solid #141B5C;border-radius:999px;padding:5px 14px;box-shadow:0 5px 0 #141B5C;white-space:nowrap}
.spark{position:absolute;color:#FFE27A;font-size:40px;text-shadow:0 0 14px #FFE27A;z-index:9}
.pz{position:absolute;width:184px;height:230px;border:6px solid #141B5C;border-radius:14px;background-size:cover;background-position:center top;box-shadow:0 10px 0 #141B5C,0 0 40px rgba(255,220,120,.55);z-index:8}
.pz:after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
</style></head><body>
