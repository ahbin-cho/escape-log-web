<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:H;src:url(../assets/fonts/black-han-sans-korean-400-normal.woff2)}
html,body{margin:0;width:1080px;height:1350px;font-family:P;font-weight:800;overflow:hidden;color:#fff;background:#8FD0FF url(../assets/maple-gem-bg.jpg) 0 -230px/1080px auto no-repeat}
.abs{position:absolute}
.t{font-family:H;font-weight:400;color:#fff;-webkit-text-stroke:10px #2A2F6B;paint-order:stroke fill;text-shadow:0 9px 0 #2A2F6B;line-height:1.12}
.pill{display:inline-block;font-size:28px;border:5px solid #2A2F6B;border-radius:999px;padding:6px 20px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#2A2F6B;border:5px solid #2A2F6B;border-radius:18px;box-shadow:0 6px 0 #2A2F6B;font-size:28px;padding:7px 16px}
.pz{position:absolute;width:164px;height:205px;border:6px solid #2A2F6B;border-radius:16px;background-size:auto 294px;background-position:center -8px;box-shadow:0 8px 0 #2A2F6B,0 0 26px rgba(255,255,255,.7);transform-origin:bottom center}
.pz:after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
.no{position:absolute;z-index:3;left:-16px;top:-16px;width:46px;height:46px;border-radius:50%;background:#FFE27A;color:#2A2F6B;border:5px solid #2A2F6B;font-family:A;font-size:24px;display:flex;align-items:center;justify-content:center}
.tag{position:absolute;z-index:3;left:50%;bottom:-34px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2A2F6B;border:4px solid #2A2F6B;border-radius:999px;font-size:21px;padding:3px 12px}
.top{position:absolute;left:56px;right:56px;top:44px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.btn{background:#FFE27A;color:#2A2F6B;border:6px solid #2A2F6B;border-radius:22px;box-shadow:0 8px 0 #2A2F6B;font-size:30px;padding:10px 24px}
</style></head><body>
<div class="top"><span style="display:flex;gap:10px"><span class="pill" style="font-family:A;background:#fff;color:#2A2F6B">방탈로그</span><span class="pill" style="background:#FF5C8A;color:#fff">🍁 NEW OPEN</span></span><span class="pill" style="background:#2A2F6B;color:#FFE27A;border-color:#FFE27A">1 / 7</span></div>
<div class="abs t" style="left:52px;top:118px;font-size:100px"><span style="color:#FFE27A">홍대</span>에 <span style="color:#FFC4E0">메이플</span>이<br>생겼다!</div>
<div class="pz" style="left:102px;top:374px;transform:rotate(-4deg);background-image:url(../../../public/ig-static/maple/2.jpg)"><span class="no">1</span><span class="tag">커닝시티</span></div><div class="pz" style="left:449px;top:290px;transform:rotate(2deg);background-image:url(../../../public/ig-static/maple/3.jpg)"><span class="no">2</span><span class="tag">무릉도장</span></div><div class="pz" style="left:852px;top:231px;transform:rotate(-3deg);background-image:url(../../../public/ig-static/maple/4.jpg)"><span class="no">3</span><span class="tag">헌티드 맨션</span></div><div class="pz" style="left:180px;top:779px;transform:rotate(3deg);background-image:url(../../../public/ig-static/maple/5.jpg)"><span class="no">4</span><span class="tag">에델슈타인</span></div><div class="pz" style="left:792px;top:779px;transform:rotate(-3deg);background-image:url(../../../public/ig-static/maple/6.jpg)"><span class="no">5</span><span class="tag">루디브리엄</span></div>
<div class="abs" style="left:0;right:0;top:1080px;display:flex;justify-content:center;gap:12px">
  <span class="chip">📚 테마 5개</span><span class="chip">⏱️ 60분</span><span class="chip">💰 1인 29,000원</span>
</div>
<div class="abs" style="left:56px;right:56px;bottom:46px;display:flex;justify-content:space-between;align-items:center">
  <span class="btn">넘겨서 한 권씩 펼쳐 보기 →</span>
  <span style="font-family:A;font-size:28px;color:#fff;-webkit-text-stroke:7px #2A2F6B;paint-order:stroke fill">bangtallog.com</span>
</div>
</body></html>
