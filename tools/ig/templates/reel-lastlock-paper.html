<!doctype html><html><head><meta charset="utf-8"><style>
/* 색종이 오려붙이기 스톱모션 (docs/reels-standard.md 기본 화풍) */
@font-face{font-family:A;src:url(../../../assets/fonts/SBAggroB.woff)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#3a2a22}
#cam{position:absolute;inset:0;transform-origin:50% 66%}
.p{position:absolute;filter:drop-shadow(7px 9px 0 #0000003d)}           /* 종이 조각: 겹쳐 붙은 그림자 */
.wall{position:absolute;top:-20px;height:1500px;width:232px}
#floor{left:-30px;top:1440px;width:1140px;height:520px;background:#6b4a3a;clip-path:polygon(0 3%,12% 0,30% 2%,52% 0,71% 3%,88% 1%,100% 2%,100% 100%,0 100%)}
#panel{left:220px;top:262px;width:640px;height:306px;background:#39424e;border-radius:44px}
#screen{left:262px;top:300px;width:556px;height:230px;background:#16181c;border-radius:22px;filter:none}
#timer{position:absolute;left:262px;top:300px;width:556px;height:230px;text-align:center;font:400 156px/236px A;color:#ff4a3d;letter-spacing:8px;filter:drop-shadow(4px 5px 0 #0008)}
#lid{left:104px;top:1004px;width:872px;height:196px;background:#d98f4e;border-radius:90px 90px 16px 16px}
#lid:after{content:"";position:absolute;left:40px;right:40px;top:26px;height:22px;border-radius:12px;background:#eab07a}
#box{left:128px;top:1166px;width:824px;height:440px;background:#c47a3c;border-radius:22px}
.plank{position:absolute;left:150px;width:780px;height:8px;background:#9c5c28;border-radius:4px}
.band{top:1000px;width:74px;height:612px;background:#e9e3d2;border-radius:10px}
.band i{position:absolute;left:25px;width:24px;height:24px;border-radius:50%;background:#8d877b}
#hasp{left:480px;top:1088px;width:120px;height:176px;background:#e9e3d2;border-radius:14px}
#hasp:after{content:"";position:absolute;left:34px;top:112px;width:52px;height:52px;border-radius:50%;background:#8d877b;box-shadow:inset 0 0 0 16px #8d877b,inset 0 0 0 30px #3a2a22}
#lock{left:300px;top:1060px;width:480px;height:540px;filter:none}
#shackle{left:96px;top:0;width:288px;height:330px;border:62px solid #f1f4f6;border-bottom:none;border-radius:144px 144px 0 0;box-sizing:border-box;transform-origin:31px 300px}
#lbody{left:0;top:222px;width:480px;height:312px;background:#f4b63f;border-radius:52px}
#lbody:after{content:"";position:absolute;left:36px;top:26px;width:300px;height:24px;border-radius:12px;background:#fbdc8f}
.w{position:absolute;top:104px;width:88px;height:156px;background:#2b2420;border-radius:14px;overflow:hidden}
.w b{position:absolute;inset:0;text-align:center;font:400 104px/160px A;color:#fff6e0;background:#2b2420}
.key{left:96px;top:590px;width:90px;height:300px;filter:drop-shadow(7px 9px 0 #0000003d)}
#frame{left:812px;top:694px;width:196px;height:244px;background:#5c3f2d;border-radius:14px}
#frame:after{content:"";position:absolute;inset:26px;background:#f1e6c9;border-radius:6px}
#ghost{position:absolute;left:676px;top:1420px;width:420px;transform-origin:50% 90%;
 filter:drop-shadow(0 0 0 #fff) drop-shadow(5px 0 0 #fffdf5) drop-shadow(-5px 0 0 #fffdf5) drop-shadow(0 5px 0 #fffdf5) drop-shadow(0 -5px 0 #fffdf5) drop-shadow(8px 10px 0 #00000040)}
#sweat{left:985px;top:1500px;width:34px;height:48px;background:#8fd0ee;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;opacity:0}
#dark{position:absolute;inset:0;background:radial-gradient(circle at var(--lx,540px) var(--ly,1380px),#0000 0,#0000 320px,#120a08a8 700px,#0a0605dc 1150px)}
#red{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#0000 35%,#b0141488);opacity:0}
#grain{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.cap{position:absolute;left:90px;right:90px;top:640px;text-align:center;opacity:0}
.cap span{display:inline-block;font:400 66px/1.25 A;white-space:nowrap;color:#1d1d1d;background:#fff6e0;padding:14px 34px;border-radius:14px;transform:rotate(-1.5deg);filter:drop-shadow(7px 9px 0 #00000055)}
#big{position:absolute;left:0;right:0;top:620px;text-align:center;font:400 270px/1 A;color:#fff6e0;opacity:0;-webkit-text-stroke:14px #1d1d1d;paint-order:stroke fill;filter:drop-shadow(12px 14px 0 #E49A4A)}
#end{position:absolute;left:0;right:0;top:96px;text-align:center;opacity:0}
#end b{display:inline-block;font:400 52px A;background:#E49A4A;color:#1D1D1D;border:6px solid #1D1D1D;border-radius:24px;padding:12px 34px;box-shadow:9px 9px 0 #1D1D1D}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0}
.conf{position:absolute;width:28px;height:40px;opacity:0;filter:drop-shadow(4px 5px 0 #0003)}
</style></head><body>
<div id="cam">
 <div id="walls"></div>
 <svg class="key p j" viewBox="0 0 90 300"><path d="M45 0v110" stroke="#2b2420" stroke-width="5"/><circle cx="45" cy="150" r="40" fill="#e9c14e"/><circle cx="45" cy="150" r="14" fill="#8a654f"/><rect x="33" y="186" width="24" height="112" rx="5" fill="#e9c14e"/><rect x="55" y="244" width="30" height="18" rx="4" fill="#e9c14e"/><rect x="55" y="274" width="24" height="18" rx="4" fill="#e9c14e"/></svg>
 <div id="frame" class="p j"></div>
 <div id="floor" class="p"></div>
 <div id="panel" class="p j"></div><div id="screen" class="p"></div>
 <div id="box" class="p j"></div><div class="plank" style="top:1306px"></div><div class="plank" style="top:1446px"></div>
 <div id="lid" class="p j"></div>
 <div class="band p j" style="left:206px"><i style="top:44px"></i><i style="top:224px"></i><i style="top:394px"></i><i style="top:552px"></i></div>
 <div class="band p j" style="left:800px"><i style="top:44px"></i><i style="top:224px"></i><i style="top:394px"></i><i style="top:552px"></i></div>
 <div id="hasp" class="p j"></div>
 <div id="lock" class="p"><div id="shackle" class="p"></div><div id="lbody" class="p"><div class="w" style="left:40px"><b>0</b></div><div class="w" style="left:144px"><b>0</b></div><div class="w" style="left:248px"><b>0</b></div><div class="w" style="left:352px"><b>0</b></div></div></div>
 <div id="dark"></div><div id="timer">00:12</div>
 <img id="ghost" src="../../../public/mascot.png"><div id="sweat" class="p"></div>
</div>
<div id="red"></div>
<svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9 .35" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .55 0"/></filter><rect width="1080" height="1920" fill="#fff"/><rect width="1080" height="1920" filter="url(#n)"/></svg>
<div class="cap" id="c1"><span>마지막 자물쇠</span></div><div class="cap" id="c2"><span>친구: “일단 0000 해 봐”</span></div><div class="cap" id="c3"><span>나: 잠깐만…</span></div>
<div id="big">탈깍!</div><div id="end"><b>남은 시간 00:01</b></div><div id="flash"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// 벽: 색종이 띠 5장(색이 조금씩 다름)
['#9a735b','#a37c63','#946d56','#a17a61','#987159'].forEach((c,i)=>{const d=document.createElement('div');d.className='wall p j';d.style.left=(i*216-8)+'px';d.style.background=c;$('#walls').appendChild(d)});
/* ── 12fps 스톱모션 시계: 모든 움직임은 이 박자에만 바뀐다 ── */
const FPS=12,FR=1000/FPS;let f=0;const at=[];           // at: [프레임, 함수]
const T=(ms,fn)=>at.push([Math.round(ms/FR),fn]);
const rnd=(a)=>(Math.random()*2-1)*a;
const S={cam:1,lockY:0,ghost:{y:0,r:0,s:1},mode:'bob',jig:0,open:0,light:true};
const lock=$('#lock'),ghost=$('#ghost'),cam=$('#cam'),dark=$('#dark'),timer=$('#timer');
function tick(){
 const t=f/FPS;
 // 매 프레임 1~2px 미세한 흔들림(손으로 다시 놓은 느낌)
 $$('.j').forEach(e=>e.style.transform=`translate(${rnd(1.6)}px,${rnd(1.6)}px) rotate(${rnd(.25)}deg)`);
 // 카메라: 11초 동안 천천히 다가감(끊어서)
 if(!S.open) S.cam=1+Math.min(t/11,1)*.15;
 cam.style.transform=`scale(${S.cam}) translate(${rnd(.8)}px,${rnd(.8)}px)`;
 // 자물쇠 당김
 let ly=0;if(S.jig>0){ly=[0,26,8,20,0][5-S.jig]||0;S.jig--}
 lock.style.transform=`translate(${rnd(1.2)}px,${ly+(S.open?24:0)+rnd(1.2)}px) rotate(${ly?rnd(1.5):rnd(.3)}deg)`;
 // 탈출귀
 let gy=0,gr=0,gs=1;
 if(S.mode==='bob'){gy=Math.sin(t*2.6)*14;gr=Math.sin(t*1.3)*2}
 else if(S.mode==='worry'){gy=rnd(5);gr=rnd(2.5);gs=.95;const sw=$('#sweat');const k=(f%10)/10;sw.style.opacity=k<.85?1:0;sw.style.transform=`translateY(${k*70}px)`}
 else {const k=Math.min((f-S.joyAt)/5,1);const b=Math.sin(Math.min((f-S.joyAt)/14,1)*Math.PI);gy=-170*b*(k)-30;gr=-10+Math.sin(t*5)*8;gs=1.1}
 ghost.style.transform=`translateY(${gy}px) rotate(${gr}deg) scale(${gs})`;
 // 손전등
 if(S.light){dark.style.setProperty('--lx',(540+Math.sin(t*.7)*110)+'px');dark.style.setProperty('--ly',(1380+Math.cos(t*.9)*70)+'px')}
 if(S.beat){$('#red').style.opacity=.55+.4*Math.abs(Math.sin(t*Math.PI*1.3))}
 }
// 실제 시간에 맞춰 박자를 센다(그리기가 밀려도 타이밍은 안 밀리게)
let t0=null;
function loop(now){if(t0===null)t0=now;const target=Math.floor((now-t0)/FR);let moved=false;
 while(f<=target){at.filter(a=>a[0]===f).forEach(a=>a[1]());f++;moved=true}
 if(moved){f--;tick();f++}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// 숫자 종이 넘기기(3박자: 접힘 → 새 숫자 → 펴짐)
const wb=$$('.w b');
const flip=(i,d,ms)=>{T(ms,()=>wb[i].style.transform='scaleY(.15)');T(ms+FR,()=>{wb[i].textContent=d;wb[i].style.transform='scaleY(.6) translateY(-10px)'});T(ms+2*FR,()=>wb[i].style.transform='none')};
// 글자 딱지: 통통 튀며 등장(easeOutBack 을 4박자로)
const pop=(id,ms)=>[.6,1.12,.97,1].forEach((s,k)=>T(ms+k*FR,()=>{const e=$(id);e.style.opacity=1;e.style.transform=`scale(${s})`}));
const hide=(id,ms)=>T(ms,()=>$(id).style.opacity=0);
for(let s=11;s>=1;s--)T((12-s)*1000,()=>{timer.textContent='00:'+String(s).padStart(2,'0');timer.style.transform='scale(1.08)';if(s===5)S.beat=true});
for(let s=11;s>=1;s--)T((12-s)*1000+FR,()=>timer.style.transform='none');
pop('#c1',300);hide('#c1',2000);pop('#c2',2250);T(2900,()=>S.jig=5);hide('#c2',3900);pop('#c3',4150);
flip(0,1,4500);flip(1,1,5200);flip(2,2,5900);
flip(3,4,6700);T(6700,()=>S.mode='worry');T(7100,()=>S.jig=5);
flip(3,7,8000);T(8400,()=>S.jig=5);T(8700,()=>$('#c3 span').textContent='나: 제발…');
flip(3,8,9500);T(9900,()=>S.jig=5);flip(3,9,10700);
T(11250,()=>{S.open=1;S.light=false;S.beat=false;S.mode='joy';S.joyAt=f;$('#sweat').style.opacity=0;$('#c3').style.opacity=0;
 dark.style.opacity=0;$('#red').style.opacity=0;$('#flash').style.opacity=.9;timer.style.color='#58e39a';S.cam=1.03;
 $('#shackle').style.transform='translateY(-70px) rotate(-22deg)';
 for(let i=0;i<54;i++){const c=document.createElement('div');c.className='conf';c.style.left=(540+rnd(90))+'px';c.style.top='1260px';
  c.style.background=['#E49A4A','#E2554A','#3E9A6A','#7A68C2','#F5C342','#fff6e0'][i%6];document.body.appendChild(c);
  const a=-Math.PI/2+rnd(1.2),d=600+Math.random()*700;
  c.animate([{opacity:1,transform:'translate(0,0) rotate(0)'},{opacity:1,transform:`translate(${Math.cos(a)*d*.6}px,${Math.sin(a)*d}px) rotate(${360*Math.random()}deg)`,offset:.35},{opacity:1,transform:`translate(${Math.cos(a)*d*.8}px,${Math.sin(a)*d+1100}px) rotate(${900*Math.random()}deg)`}],{duration:2600,easing:'steps(31)',fill:'forwards'})}
});
T(11250+FR,()=>$('#flash').style.opacity=.5);T(11250+2*FR,()=>$('#flash').style.opacity=.2);T(11250+3*FR,()=>$('#flash').style.opacity=0);
[.5,1.15,.96,1].forEach((s,k)=>T(11250+k*FR,()=>{const b=$('#big');b.style.opacity=1;b.style.transform=`scale(${s}) rotate(-4deg)`}));
[.6,1.1,1].forEach((s,k)=>T(12100+k*FR,()=>{const e=$('#end');e.style.opacity=1;e.style.transform=`scale(${s})`}));
</script></body></html>
