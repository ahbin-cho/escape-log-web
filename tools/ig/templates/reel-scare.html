<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-ExtraBold.woff);font-weight:800}
@font-face{font-family:P;src:url(../../../assets/fonts/Pretendard-Medium.woff);font-weight:500}
@font-face{font-family:M;src:url(../assets/fonts/nanum-myeongjo-korean-800-normal.woff2)}
@font-face{font-family:B;src:url(../assets/fonts/nanum-brush-script-korean-400-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:P}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;background:url(../assets/reel-scare.jpg) center/cover;opacity:.6;transform-origin:70% 40%;
  animation:in .6s forwards,zoom 10.5s linear forwards,dim .8s 1.55s forwards}
@keyframes in{to{opacity:1}} @keyframes zoom{from{transform:scale(1.03)}to{transform:scale(1.15)}}
@keyframes dim{to{filter:brightness(.45)}} @keyframes out{to{opacity:0}}
.grain{position:absolute;inset:-50%;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:7px 9px;animation:gr .18s steps(3) infinite;mix-blend-mode:screen;z-index:5}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-11px,7px)}66%{transform:translate(9px,-5px)}}
.flick{position:absolute;inset:0;background:#000;opacity:0;z-index:20;animation:fl .22s 3.55s,fl .3s 5.35s}
@keyframes fl{0%,100%{opacity:0}30%{opacity:.85}60%{opacity:.2}}
.pale{font-family:M;color:#EFE3CC;letter-spacing:.12em;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.acc{color:#E07A2A;text-shadow:0 0 18px rgba(224,122,42,.45)}
.hook{position:absolute;left:0;right:0;top:1180px;text-align:center;animation:out .25s 1.45s forwards;z-index:30}
.hook .a{font-size:74px} .hook .b{font-size:104px;margin-top:20px}
.w{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;opacity:0;filter:blur(10px);letter-spacing:.28em;animation:wr var(--d,.9s) var(--t) cubic-bezier(.2,.7,.3,1) forwards;z-index:25}
@keyframes wr{to{opacity:1;filter:blur(0);letter-spacing:.1em}}
.meta{position:absolute;left:84px;top:1225px;opacity:0;animation:in .7s 6.3s forwards;z-index:25}
.meta .t{font-size:130px;line-height:1.05}
.meta .s{font-family:M;font-size:40px;margin-top:10px;letter-spacing:.3em;color:#EFE3CC}
.meta .k{font-weight:800;font-size:34px;color:#EDE6DA;margin-top:24px}
.meta .c{font-weight:800;font-size:31px;color:#A9A39A;margin-top:8px}
.meta .n{font-weight:500;font-size:24px;color:#8F897F;margin-top:8px}
.post{position:absolute;right:84px;top:1232px;width:218px;opacity:0;animation:in .7s 6.6s forwards;z-index:25}
.post img{display:block;width:218px;border:2px solid rgba(237,230,218,.3)}
.post div{font-weight:500;font-size:20px;color:#8F897F;margin-top:8px;text-align:right}
.cta{position:absolute;left:72px;right:72px;top:1600px;display:flex;align-items:center;gap:24px;background:#F5F0E6;border:5px solid #1D1D1D;border-radius:30px;padding:22px 30px;box-shadow:8px 9px 0 #1D1D1D;opacity:0;transform:translateY(50px);animation:card .6s 8.3s cubic-bezier(.22,1,.36,1) forwards;z-index:40}
@keyframes card{to{opacity:1;transform:none}}
.cta .x{color:#1D1D1D;font-weight:800;font-size:44px;letter-spacing:-.03em}.cta .x b{color:#E0782A}
.cta .s{color:#6B665D;font-weight:500;font-size:28px;margin-top:6px}
.hook .b{font-size:92px}.meta .t{font-family:M;color:#EFE3CC;letter-spacing:.14em}

.world{position:absolute;inset:0;animation:dimw .8s 1.55s forwards}
@keyframes dimw{to{filter:brightness(.72)}}
.skyw{position:absolute;inset:0;animation:drift 4.7s linear forwards}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-36px)}}
.sky{position:absolute;inset:0 -40px 0 0;background:url(../assets/reel-scare-gem.jpg) left top/1080px 1920px;transform-origin:72% 35%;animation:zoom3 10.5s linear forwards}
@keyframes zoom3{from{transform:scale(1)}to{transform:scale(1.1)}}
.sweep{position:absolute;left:-700px;top:1240px;width:760px;height:520px;background:radial-gradient(closest-side,rgba(255,236,180,.4),rgba(255,226,160,.12) 50%,transparent 100%);mix-blend-mode:screen;z-index:2;animation:sw 1.5s linear 3 forwards}
@keyframes sw{from{transform:translateX(0) rotate(-6deg)}to{transform:translateX(1900px) rotate(4deg)}}
.swerve{position:absolute;inset:0;background:radial-gradient(ellipse 520px 300px at 30% 70%,rgba(255,236,180,.4),transparent 70%);mix-blend-mode:screen;opacity:0;z-index:2}
.last{position:absolute;left:-40px;top:1500px;width:1100px;height:460px;background:radial-gradient(farthest-side at 0% 50%,rgba(255,232,170,.5),rgba(255,226,160,.14) 45%,transparent 100%);transform-origin:0 50%;transform:rotate(-30deg);mix-blend-mode:screen;opacity:0;z-index:2}
.crash .last{animation:hl 1.1s steps(1) infinite}
@keyframes hl{0%{opacity:1}30%{opacity:.15}35%{opacity:1}70%{opacity:0}75%{opacity:.85}}
.dust{position:absolute;left:-60px;top:1500px;width:520px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(170,150,120,.38),transparent 100%);opacity:0;z-index:3}
.crash .dust{animation:sm 3s ease-out infinite}
@keyframes sm{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(160px,-260px) scale(1.7)}}
.stopped .skyw{animation-play-state:paused}
.shk{animation:shk .07s linear 6}
@keyframes shk{0%{translate:0 0}25%{translate:-14px 8px}50%{translate:12px -10px}75%{translate:-8px -6px}}
.crashfl{position:absolute;inset:0;background:#fff4dc;opacity:0;z-index:21}
@keyframes fp{0%{opacity:0}15%{opacity:1}100%{opacity:0}}@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}100%{opacity:.9;transform:translate(120px,2000px) rotate(540deg)}}</style></head><body><div class="stage">
<div class="world" id="world"><div class="skyw"><div class="sky"></div></div><div class="sweep"></div><div class="swerve" id="swv"></div><div class="last"></div><div class="dust"></div><div class="dust" style="left:120px;animation-delay:1.1s"></div></div><div class="crashfl" id="cf"></div><script>const sv=document.getElementById("swv");[[4350,.9],[4450,.2],[4520,1],[4600,.3]].forEach(([t,o])=>setTimeout(()=>sv.style.opacity=o,t));setTimeout(()=>{sv.style.opacity=0;const w=document.getElementById("world");w.classList.add("stopped","crash");document.querySelector(".stage").classList.add("shk");const f=document.getElementById("cf");f.style.opacity=.85;f.style.transition="opacity .5s";requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.opacity=0))},4700);</script><div class="grain"></div><div class="flick"></div>
<div class="hook pale"><div class="a">한밤의 시골길,</div><div class="b acc">옥수수밭만 끝없이</div></div>
<div class="w pale" style="top:560px;font-size:62px;--t:1.9s">미국 서부 어느 지역</div>
<div class="w pale" style="top:660px;font-size:74px;--t:2.8s">차를 타고 이동 중에..</div>
<div class="w pale" style="top:780px;font-size:74px;--t:3.7s">옥수수밭 근처에서</div>
<div class="w pale acc" style="top:1040px;font-size:80px;--t:4.7s;--d:1.0s">사고가 나고 마는데..</div>
<div class="meta"><div class="t">허수아비</div><div class="k">둠이스케이프 FEAR점 (수원)</div><div class="c">공포 · 난이도 4/5 · 공포도 4/5</div></div>

<div class="cta"><img src="../../../public/mascot.png" width="110" height="110"><div><div class="x">다녀왔다면 <b>한 줄 기록</b></div><div class="s">줄거리·후기는 프로필 링크 · talkkaknote.com</div></div></div>
</div></body></html>
