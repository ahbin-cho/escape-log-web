</div><script>const $=i=>document.getElementById(i);const cl=x=>Math.max(0,Math.min(1,x));const e=t=>1-Math.pow(1-t,3);
const lines=[...document.querySelectorAll('.ln')];
function seek(t){
 $('hook').style.opacity=t<1.5?1:cl(1-(t-1.5)/.2);
 lines.forEach(l=>{const k=cl((t-+l.dataset.t)/+l.dataset.d);l.style.clipPath=`inset(-20% ${(1-k)*105}% -20% 0)`;});
 const r=cl((t-9.0)/.6);$('ring').style.clipPath=`inset(0 ${(1-r)*100}% 0 0)`;
}window.seek=seek;seek(0);</script></body></html>
