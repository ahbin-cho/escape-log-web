name: 인스타 지금 올리기

# 일정과 상관없이 원하는 게시물을 바로 올린다(Actions 탭 → Run workflow, 또는 Claude 가 실행).
# 필요한 것: 저장소 Settings → Secrets → Actions 에 CRON_SECRET (Vercel 과 같은 값)
on:
  workflow_dispatch:
    inputs:
      set:
        description: "올릴 것 (비우면 오늘 일정) 예: intro, collection:수원, story:<id>, reel:<id>, cafes:yearend, ad-recap"
        required: false
        default: ""
      dry:
        description: "미리보기만(실제로 안 올림)"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 게시
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SET: ${{ inputs.set }}
          DRY: ${{ inputs.dry }}
        run: |
          q=""
          [ -n "$SET" ] && q="set=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SET"]))')"
          [ "$DRY" = "true" ] && q="$q&dry=1"
          call() { curl -sS -m 70 -w '\n%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "https://bangtallog.com/api/ig/publish?$1"; }
          # 카드 이미지를 미리 한 번 불러 둬서 인스타가 가져갈 때 빨리 나오게
          if [ "$DRY" != "true" ]; then
            call "$q&dry=1" | sed '$d' | python3 -c 'import json,sys;d=json.load(sys.stdin);print("\n".join(d.get("imageUrls") or []))' > urls.txt || true
            while read -r u; do [ -n "$u" ] && curl -s -o /dev/null -m 60 "$u" & done < urls.txt; wait
          fi
          out=$(call "$q"); code=$(echo "$out" | tail -1); body=$(echo "$out" | sed '$d'); echo "$body"
          # 인스타 처리가 늦으면(202) 돌려준 값으로 이어서
          for i in 1 2 3 4 5 6; do
            [ "$code" = "202" ] || break
            next=$(echo "$body" | python3 -c 'import json,sys,urllib.parse as u;d=json.load(sys.stdin);print("finish="+d["creationId"] if d.get("creationId") else "children="+u.quote(d["children"]))')
            sleep 20
            [ -n "$SET" ] && next="$next&set=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SET"]))')"
            out=$(call "$next"); code=$(echo "$out" | tail -1); body=$(echo "$out" | sed '$d'); echo "$body"
          done
          # 끝까지 처리 중(202)이면 실패로 표시해서 알아차리게
          if [ "$code" = "202" ]; then echo "::error::인스타 처리가 끝나지 않아 게시되지 않았어요. 다시 실행해 주세요."; exit 1; fi
          [ "$code" -lt 300 ]
