name: 인스타 댓글

# 최근 게시물의 댓글을 모아 보거나(list), 운영자가 확인한 답글을 단다(reply).
# Claude 가 실행해서 로그로 댓글을 읽는다. 토큰은 Vercel 에만 있고 여기선 CRON_SECRET 만 쓴다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = 댓글 모아 보기, reply = 답글 달기"
        type: choice
        options: [list, reply]
        default: list
      limit:
        description: "list: 최근 게시물 몇 개(최대 25)"
        default: "10"
      comment_id:
        description: "reply: 답글을 달 댓글 ID"
        default: ""
      message:
        description: "reply: 답글 내용"
        default: ""

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - name: 댓글
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          CID: ${{ inputs.comment_id }}
          MSG: ${{ inputs.message }}
        run: |
          if [ "$MODE" = "reply" ]; then
            body=$(python3 -c 'import json,os;print(json.dumps({"message":os.environ["MSG"]}))')
            out=$(curl -sS -m 40 -w '\n%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
              --data "$body" "https://talkkaknote.com/api/ig/comments?reply=$CID")
          else
            out=$(curl -sS -m 40 -w '\n%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "https://talkkaknote.com/api/ig/comments?limit=$LIMIT")
          fi
          code=$(echo "$out" | tail -1); echo "$out" | sed '$d'
          [ "$code" -lt 300 ]
